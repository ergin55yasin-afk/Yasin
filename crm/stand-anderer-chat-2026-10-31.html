<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mein CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F5F9; --surface:#FFFFFF; --ink:#0B1B33; --muted:#586A82; --line:#DCE4EE; --brand:#0B1730; --cta:#22E3FF; --cta-ink:#051018; --amber:#E08A00; --orange:#E08A00;
  --accent:#0A4A9C; --accent-ink:#FFFFFF; --warn:#9A5F0E; --late:#B3362D; --ok:#2C7A57; --chip:#E7EEF8;
  --c-alter:#B8690A; --c-alter-bg:#FBEEDC; --c-anlage:#2C7A57; --c-anlage-bg:#E0F1E9; --c-kv:#1F7A8C; --c-kv-bg:#DCEFF2; --c-sach:#25507A; --c-sach-bg:#E2EBF5; --c-viol:#6B4FA0; --c-viol-bg:#ECE6F5; --c-late-bg:#FBE3E0; --c-warn-bg:#FBEEDC;
  --r:12px; --shadow:none; --mono:"JetBrains Mono",ui-monospace,monospace; --font-d:"Space Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#070B14; --surface:#0E1626; --ink:#E6F0FF; --muted:#8CA2C3; --line:#1B2A44; --brand:#0A1120; --cta:#22E3FF; --cta-ink:#051018; --amber:#FFB020; --orange:#FFB020;
    --accent:#22E3FF; --accent-ink:#0E1620; --warn:#E0A04A; --late:#E5776E; --ok:#6CC49C; --chip:#13213A; --c-alter:#E0A04A; --c-alter-bg:#3A2A12; --c-anlage:#6CC49C; --c-anlage-bg:#143329; --c-kv:#62C3D6; --c-kv-bg:#123340; --c-sach:#6FA2D6; --c-sach-bg:#1A2D42; --c-viol:#B7A2E6; --c-viol-bg:#2A2340; --c-late-bg:#3B1D1A; --c-warn-bg:#3A2A12; --shadow:none;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#070B14; --surface:#0E1626; --ink:#E6F0FF; --muted:#8CA2C3; --line:#1B2A44; --brand:#0A1120; --cta:#22E3FF; --cta-ink:#051018; --amber:#FFB020; --orange:#FFB020;
  --accent:#22E3FF; --accent-ink:#0E1620; --warn:#E0A04A; --late:#E5776E; --ok:#6CC49C; --chip:#13213A; --c-alter:#E0A04A; --c-alter-bg:#3A2A12; --c-anlage:#6CC49C; --c-anlage-bg:#143329; --c-kv:#62C3D6; --c-kv-bg:#123340; --c-sach:#6FA2D6; --c-sach-bg:#1A2D42; --c-viol:#B7A2E6; --c-viol-bg:#2A2340; --c-late-bg:#3B1D1A; --c-warn-bg:#3A2A12; --shadow:none;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);
  display:flex;justify-content:space-between;align-items:flex-start;
  padding:16px 16px 8px;max-width:560px;margin:0 auto}
.top h1{margin:0;font-size:26px;line-height:1.15;font-weight:700;letter-spacing:-.01em}
.top p{margin:2px 0 0;color:var(--muted);font-size:14px}
.icon{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);
  display:grid;place-items:center;color:var(--ink)}

main{max-width:560px;margin:0 auto;padding:4px 16px 150px}
.summary{font-size:17px;font-weight:560;line-height:1.35;margin:8px 0 10px}
.banner{max-width:560px;margin:4px auto 0;padding:0 16px}
.note{background:var(--chip);border-left:4px solid var(--warn);border-radius:10px;padding:10px 12px;font-size:14px;margin:0 0 10px}
.note .btn{margin-top:8px}

.hints{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:0 0 6px}
.hints summary{list-style:none;cursor:pointer;padding:12px 14px;font-weight:650;display:flex;justify-content:space-between;align-items:center;min-height:44px}
.hints summary::-webkit-details-marker{display:none}
.hints .count{background:var(--accent);color:var(--accent-ink);border-radius:999px;font-size:13px;padding:1px 9px}
.hint{border-top:1px solid var(--line);padding:12px 14px;font-size:15px}
.hint .actions{margin-top:8px}
.hints .fine{font-size:12.5px;color:var(--muted);padding:0 14px 12px}

.group{margin:22px 0 8px;font-size:14px;font-weight:650;display:flex;gap:8px;align-items:baseline}
.group span{color:var(--muted);font-weight:500}
.group.now{color:var(--late)}
.group.week{color:var(--accent)}
.group.two,.group.later{color:var(--muted)}

.row{display:flex;gap:12px;align-items:flex-start;background:var(--surface);
  border:1px solid var(--line);border-left:4px solid var(--edge,var(--line));
  border-radius:12px;padding:12px;margin-bottom:8px}
.row.late{--edge:var(--late)} .row.today{--edge:var(--warn)} .row.soon{--edge:var(--accent)} .row.later{--edge:var(--line)}
.row .body{flex:1;min-width:0;cursor:pointer}
.line1{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tag{font-weight:650;font-size:14px;background:var(--chip);padding:2px 8px;border-radius:6px}
.when{font-size:13px;color:var(--muted)}
.row.late .when{color:var(--late);font-weight:600}
.txt{margin-top:4px;word-break:break-word}
.sub{font-size:14px;color:var(--muted);margin-top:2px;word-break:break-word}
.check{position:relative;flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--muted);background:transparent;margin-top:1px}
.check::before{content:"";position:absolute;inset:-10px}
.check:hover{border-color:var(--ok)}
.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}

.card{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:12px 14px;margin-bottom:8px}
.card .head{display:flex;justify-content:space-between;gap:8px;align-items:center}
.pill{font-size:12px;font-weight:650;padding:3px 9px;border-radius:999px;background:var(--chip);color:var(--muted)}
.pill.offen{color:var(--accent)} .pill.nachgefasst{color:var(--warn)}
.pill.abgeschlossen{color:var(--ok)} .pill.abgelehnt{color:var(--muted)}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:14px;min-height:36px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:650}

.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.btn.primary{background:var(--accent);color:#fff;border-color:transparent}
.btn.small{min-height:36px;padding:0 12px;font-size:14px}
.btn.danger{color:var(--late)}
.btn.block{width:100%}

.search{width:100%;margin:6px 0 14px}
input[type=text],input[type=date],select,textarea{width:100%;min-height:46px;padding:10px 12px;border-radius:10px;
  border:1px solid var(--line);background:var(--bg);font-size:16px}
textarea{min-height:84px;resize:vertical}
label{display:block;font-size:14px;font-weight:600;margin:14px 0 6px}
.hint-t{font-size:13px;color:var(--muted);margin:6px 0 0}
.err{color:var(--late);font-size:14px;font-weight:600;margin:12px 0 0}
.seg{display:flex;background:var(--chip);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;min-height:38px;border:0;border-radius:8px;background:transparent;font-weight:560;font-size:14px;padding:0 4px}
.seg button[aria-pressed="true"]{background:var(--surface);font-weight:700;box-shadow:0 1px 0 var(--line)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btnrow{display:flex;gap:10px;margin-top:18px}
.btnrow .btn{flex:1}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:20px;text-align:center;color:var(--muted);margin-top:18px}
.empty .btn{margin-top:12px;color:var(--ink)}.empty .btn.primary{color:var(--accent-ink)}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);
  display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;min-height:56px;border:0;background:transparent;color:var(--muted);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px}
.tabs button[aria-current="page"]{color:var(--accent);font-weight:700}
.fab{position:fixed;right:16px;bottom:calc(56px + env(safe-area-inset-bottom,0px) + 16px);z-index:11;
  width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);
  display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.28)}

#sheet{position:fixed;inset:0;z-index:30}
#sheet[hidden],#toast[hidden]{display:none}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.panel{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:92%;overflow:auto;
  background:var(--surface);border-radius:20px 20px 0 0;padding:14px 16px calc(22px + env(safe-area-inset-bottom,0px));
  animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.panel h3{margin:0 0 4px;font-size:20px;line-height:1.2}
.panel h4{margin:20px 0 8px;font-size:14px;color:var(--muted);font-weight:650}
.mini{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.mini:first-of-type{border-top:0}
.mini .body{flex:1;min-width:0;cursor:pointer}
.done .txt{text-decoration:line-through;color:var(--muted)}

#toast{position:fixed;left:16px;right:16px;bottom:calc(56px + env(safe-area-inset-bottom,0px) + 88px);z-index:40;
  max-width:520px;margin:0 auto;background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:12px;
  display:flex;justify-content:space-between;align-items:center;gap:12px}
#toast button{background:transparent;border:0;color:var(--bg);text-decoration:underline;font-weight:650;min-height:36px}

@media (prefers-reduced-motion: reduce){.panel{animation:none}}

.fab[hidden]{display:none}
.fl{display:block;margin:12px 0 0;font-weight:600;font-size:14px}
.fl>span:first-child{display:block;margin-bottom:5px}
.fl small{display:block;font-weight:400;color:var(--muted);font-size:13px;margin-top:4px}
.fi{display:flex;align-items:center;gap:8px}
.fi em{font-style:normal;color:var(--muted);font-size:13px;white-space:nowrap;font-weight:400}
.ck{display:flex;align-items:center;gap:10px;margin:10px 0;font-weight:600;font-size:15px}
.ck input{width:22px;height:22px;flex:none}
.sh{margin:6px 0 4px;font-size:20px}.sh2{margin:20px 0 6px;font-size:14px;color:var(--muted);font-weight:650}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat .sl{font-size:12px;color:var(--muted)}.stat .sv{font-size:20px;font-weight:700}.stat .ss{font-size:12px;color:var(--muted)}
.stat.bad .sv{color:var(--late)}.stat.good .sv{color:var(--ok)}
.chartbox{background:#fff;border:1px solid var(--line);border-radius:12px;margin:12px 0;overflow:hidden}
.chartbox canvas{display:block}
.pbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 12px 12px;margin:10px 0}
.mrow{border-top:1px solid var(--line);padding:10px 0}
.mname{display:flex;gap:6px;align-items:center}.mname input{font-weight:600}
.mname .x{border:0;background:transparent;font-size:24px;width:40px;min-height:40px;color:var(--muted)}
.mcols{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.mcols small{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
.mcols input,.mcols select{margin-top:5px}
select[data-amp]{border-left:6px solid var(--line)}
select[data-amp="keine"],select[data-amp="sorge"]{border-left-color:#B3362D}select[data-amp="gkv"],select[data-amp="egal"]{border-left-color:#B8690A}select[data-amp="zus"]{border-left-color:#25507A}select[data-amp="voll"],select[data-amp="wichtig"]{border-left-color:#2C7A57}
.letterbox{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface)}.letterbox pre{white-space:pre-wrap;word-wrap:break-word;font:inherit;margin:8px 0 0}.letterbox .lsub{font-weight:650;margin-bottom:10px}.letterbox .lbody{font-size:15px;line-height:1.45}.letterbox .lbody p,.letterbox .lbody ul{margin:0 0 10px}
select[data-amp="ja"]{border-left-color:#2C7A57}select[data-amp="teil"]{border-left-color:#B8690A}select[data-amp="nein"]{border-left-color:#B3362D}
details.adv{margin:14px 0}details.adv summary{cursor:pointer;font-weight:600;min-height:40px;display:flex;align-items:center}
textarea{width:100%}


.rvgrid{display:grid;grid-template-columns:1fr;gap:14px;align-items:start}
@media(min-width:900px){.rvgrid{grid-template-columns:1fr 360px}.rvd{position:sticky;top:16px}}
.rvmap{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;background:var(--chip);border-radius:16px;padding:12px;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:36px 36px}
.rvf{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.rvf h3{margin:0;font-size:16px;display:flex;align-items:center;gap:8px;color:var(--accent)}.rvf h3{color:var(--ink)}.rvf h3 svg{color:var(--accent)}
.rvs{margin:0;font-size:13px;color:var(--muted)}.rvs b{color:var(--ink)}
.rvb{display:flex;flex-direction:column;gap:6px}
.rvchip{display:flex;align-items:center;gap:10px;text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:6px 10px;min-height:48px;color:var(--ink)}
.rvchip[aria-pressed=true]{border-color:var(--accent);background:var(--chip)}
.rvchip i{font-style:normal;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.rvchip span{display:flex;flex-direction:column;font-weight:600;font-size:14px}.rvchip small{font-weight:400;color:var(--muted);font-size:12px}
.rvd{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}.rvd h3{margin:0;font-size:22px}
.rvk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.rvk div{background:var(--chip);border-radius:12px;padding:10px}.rvk b{display:block;font-size:22px}.rvk small{color:var(--muted);font-size:12px}
.rvl{padding-left:18px;margin:8px 0 0;font-size:14.5px;line-height:1.45}.rvl li{margin-bottom:8px}
.lw{margin-bottom:16px}.lwc{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.lwc .chip[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.lwg{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--amber);border-radius:12px;padding:10px 12px;margin-top:8px}.lwg>b{font-family:var(--mono);font-size:20px;color:var(--amber)}.lwg>div{flex:1;display:flex;flex-direction:column}.lwg span{font-size:13px;color:var(--muted)}

.kts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media(min-width:700px){.kts{grid-template-columns:repeat(4,1fr)}}
.kt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;min-height:0;color:var(--ink)}
.kt b{font-family:var(--font-d);font-size:38px;line-height:1;letter-spacing:-.02em}.kt span{font-weight:700;font-size:15px}.kt small{color:var(--muted);font-size:12.5px;line-height:1.3}
.kt.hot{border-color:var(--late);background:var(--c-late-bg)}.kt.hot b{color:var(--late)}
.ovg{display:grid;grid-template-columns:1fr;gap:14px}@media(min-width:900px){.ovg{grid-template-columns:1fr 1fr;align-items:start}}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.tl2{display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;min-height:76px;color:var(--ink)}
.tl2 strong{display:block;font-size:16px}.tl2 small{display:block;color:var(--muted);font-size:12.5px;line-height:1.3;margin-top:2px}
.tli{flex:none;width:44px;height:44px;border-radius:12px;background:var(--chip);color:var(--accent);display:grid;place-items:center}
.tl2.pri{background:var(--brand);color:#fff;border-color:var(--brand)}.tl2.pri small{color:#B8C6DC}.tl2.pri .tli{background:var(--cta);color:var(--cta-ink)}
.mcover{background:var(--brand);color:#fff;border-radius:20px;padding:22px;border:0}.mcover h2{font-family:"Newsreader",Georgia,serif;font-size:32px;font-weight:600;color:#fff;margin:4px 0}.mcover p{color:#B8C6DC}.mcover small{letter-spacing:.16em;color:var(--cta);font-family:var(--mono);font-size:11px}
.mcover .tile{background:rgba(255,255,255,.07)!important;border-color:rgba(255,255,255,.18)!important;color:#fff}.mcover .tile strong{color:#fff}.mcover .tile .tic{background:rgba(255,255,255,.12);color:var(--cta)}.mcover .tile .ttx span{color:#B8C6DC}.mcover .tile.on{border-color:var(--cta)!important;background:rgba(34,227,255,.14)!important}.mcover .fl,.mcover label{color:#fff}.mcover .fl small{color:#B8C6DC;letter-spacing:0;font-family:inherit;font-size:12px}
.chat{display:flex;flex-direction:column;gap:10px}
.cmsgs{display:flex;flex-direction:column;gap:8px;min-height:240px;max-height:calc(100vh - 330px);overflow:auto;padding:4px 2px}
.cm{max-width:88%;padding:10px 14px;border-radius:16px;font-size:15.5px;line-height:1.45}
.cm.u{align-self:flex-end;background:var(--brand);color:#fff;border-bottom-right-radius:4px}.cm.a{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.cm.s{align-self:stretch;max-width:100%;background:var(--chip);font-size:13.5px;border-left:4px solid var(--ok)}.cm.i{align-self:stretch;max-width:100%;background:transparent;color:var(--muted);font-size:14.5px;padding-left:0}.cm.dim{color:var(--muted)}
.cbar{display:flex;gap:8px;align-items:flex-end}.cbar textarea{flex:1;min-height:52px;resize:none}.cbar .btn{min-height:52px}.cbar .btn.rec{background:var(--late);color:#fff}

.cpfab{position:fixed;right:16px;bottom:calc(56px + env(safe-area-inset-bottom,0px) + 16px);z-index:11;width:56px;height:56px;border-radius:50%;border:0;background:var(--brand);color:var(--cta);display:grid;place-items:center;box-shadow:0 6px 16px rgba(0,0,0,.3)}
.cpfab[hidden]{display:none}

/* ===== Design 4: Volksbank-Look, groß und freundlich ===== */
body{font-size:16.5px;letter-spacing:-.003em;font-family:'Space Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}

.list .row:last-child{border-bottom:0}
.tag{background:var(--chip);color:var(--accent);border-radius:8px;padding:3px 9px;font-weight:700}
.pill.wait{background:#FDEBD0;color:#8A4B00}
.pill.kuend{background:var(--c-late-bg);color:var(--late)}
.btn{min-height:50px;border-radius:12px;border-color:var(--line);font-weight:650;font-size:16px}

.stat.grow .sv{color:var(--accent)}
.m-vorsorge,.m-alter,.m-anlage,.m-kv,.m-sach,.m-viol,.m-acc{--mc:var(--accent);--mb:var(--chip)}

.wks{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0;background:var(--surface)}.wks h4{margin:0 0 6px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}.wks p{margin:4px 0}.wks ul,.wks ol{margin:4px 0;padding-left:20px}
.wkhl{border-left:5px solid var(--accent)}.wkwarn{border-left:5px solid var(--warn);background:var(--c-warn-bg)}
.wkq{font-size:16px;font-weight:550}
.wkmerk{background:var(--c-warn-bg);border-left:5px solid var(--amber);border-radius:10px;padding:8px 12px}.wkmerk p{margin:4px 0;font-weight:650}
.wkgb{display:grid;grid-template-columns:1fr 1fr;gap:8px}.wkg,.wkb{border-radius:10px;padding:10px 12px;font-size:14.5px}.wkg{background:var(--c-anlage-bg)}.wkb{background:var(--c-late-bg)}.wkg small,.wkb small{display:block;font-weight:700;margin-bottom:2px}
.wkdia{display:flex;flex-direction:column;gap:6px}.wkd{max-width:88%;padding:8px 12px;border-radius:14px;font-size:14.5px}.wkd small{display:block;font-size:11px;font-weight:700;color:var(--muted)}.wkd.k{background:var(--chip);align-self:flex-start}.wkd.b{background:var(--c-sach-bg);align-self:flex-end}
.wkans{border:1px solid var(--accent);border-radius:16px;padding:14px;margin:0 0 14px;background:var(--surface)}.wkansh{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px}.wkansh span{font-size:12px;color:var(--muted)}.wkans h4{margin:12px 0 4px}
.wksrc{font-size:13px;color:var(--muted)}
@media(max-width:520px){.wkgb{grid-template-columns:1fr}.wkd{max-width:100%}.wkhead h2{font-size:19px}}
</style>
</head>
<body>
<header class="top">
  <div><h1 id="title">Aufgaben</h1><p id="dateline"></p></div>
  <div class="topbtns"><button class="icon" data-act="search" aria-label="Suchen" title="Suchen (Strg+K)"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button><button class="icon" data-act="more" aria-label="Mehr" title="Mehr"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></button></div>
</header>
<div id="fbui" hidden></div>
<div class="banner" id="banner"></div>
<main id="view"></main>
<button class="cpfab" data-act="tab" data-tab="copilot" aria-label="Copilot"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg></button>
<button class="fab" data-act="add" aria-label="Neuer Eintrag">
  <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>
<nav class="tabs" aria-label="Bereiche">
  <div class="brand"><i>M</i>Mein CRM</div>
  <button data-act="tab" data-tab="dash"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg>Start</button>
  <button data-act="tab" data-tab="start"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg>Heute</button>
  <button data-act="tab" data-tab="aufgaben"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4M9 15l2 2 4-4"/></svg>Aufgaben</button>
  <button data-act="tab" data-tab="kunden"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Kunden</button>
  <button data-act="tab" data-tab="pipeline"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4v16M10 4v10M16 4v13M22 4v6"/></svg>Pipeline</button>
  <button data-act="ber-menu" data-tab="beratung"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Beratung</button>
</nav>
<div id="sheet" hidden>
  <div class="backdrop" data-act="close"></div>
  <div class="panel" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheetbody"></div></div>
</div>
<div id="talk" hidden></div>
<div id="toast" hidden><span id="toastmsg"></span><button id="toastbtn" hidden></button></div>
<datalist id="kunden-list"></datalist>

<script>
(function(){
'use strict';
var SPARTEN=['Leben und Rente','Berufsunfähigkeit','Kranken','Unfall','Haftpflicht','Hausrat','Wohngebäude','KFZ','Rechtsschutz','Sonstiges'];
var BEREICHE=['Altersvorsorge','Geldanlage','Krankenversicherung','Sachversicherungen'];
var ERG=[['offen','Offen'],['angebot','Angebot erstellt'],['abschluss','Abschluss'],['verloren','Verloren']];
var GRUENDE=['Preis','Vertrag läuft noch','Kein Termin oder keine Zeit','Bindung oder Vertrauen','Bankberater','Sonstiges'];
function plBer(){var l=db.settings&&db.settings.berater;return l&&l.length?l:['Berater A','Berater B','Berater C','Berater D','Berater E','Berater F','Berater G','Berater H']}
function plFil(){var l=db.settings&&db.settings.filialen;return l&&l.length?l:['Filiale 1','Filiale 2','Filiale 3','Filiale 4','Filiale 5','Filiale 6']}
function ergSel(id,erg,grund,dataAttr,ber,fil){
  var a=dataAttr?function(n){return ' data-adv="'+n+'"'}:function(n){return ''};
  return '<label for="'+id+'-erg">Ergebnis des Gesprächs</label><select id="'+id+'-erg"'+a('erg')+'>'+ERG.map(function(o){return '<option value="'+o[0]+'"'+((erg||'offen')===o[0]?' selected':'')+'>'+o[1]+'</option>'}).join('')+'</select>'+
    '<label for="'+id+'-grund">Grund, falls verloren</label><select id="'+id+'-grund"'+a('grund')+'><option value="">Keine Angabe</option>'+GRUENDE.map(function(g){return '<option'+(g===grund?' selected':'')+'>'+esc(g)+'</option>'}).join('')+'</select>'+
    '<label for="'+id+'-ber">Bankberater</label><select id="'+id+'-ber"'+a('ber')+'><option value="">Keine Angabe</option>'+plBer().map(function(g){return '<option'+(g===ber?' selected':'')+'>'+esc(g)+'</option>'}).join('')+'</select>'+
    '<label for="'+id+'-fil">Filiale</label><select id="'+id+'-fil"'+a('fil')+'><option value="">Keine Angabe</option>'+plFil().map(function(g){return '<option'+(g===fil?' selected':'')+'>'+esc(g)+'</option>'}).join('')+'</select>';
}

/* ================= Pipeline-Board ================= */
var plF={ber:'',fil:'',tage:'90'};
function plList(){
  var lim=plF.tage==='alle'?'':addDaysIso(todayIso(),-Number(plF.tage));
  return db.beratungen.filter(function(b){return (!plF.ber||b.ber===plF.ber)&&(!plF.fil||b.fil===plF.fil)&&(!lim||b.datum>=lim)});
}
function plNext(e){var i=ERG.map(function(o){return o[0]}).indexOf(e||'offen');return i>=0&&i<2?ERG[i+1][0]:(i===2?'':'')}
function viewPipeline(){
  var L=plList();
  var sel=function(k,list,lab){return '<select data-plf="'+k+'" aria-label="'+lab+'"><option value="">'+lab+': alle</option>'+list.map(function(g){return '<option'+(plF[k]===g?' selected':'')+'>'+esc(g)+'</option>'}).join('')+'</select>'};
  var h='<div class="plbar">'+sel('ber',plBer(),'Bankberater')+sel('fil',plFil(),'Filiale')+
    '<select data-plf="tage" aria-label="Zeitraum">'+[['30','30 Tage'],['90','90 Tage'],['365','1 Jahr'],['alle','Alles']].map(function(o){return '<option value="'+o[0]+'"'+(plF.tage===o[0]?' selected':'')+'>'+o[1]+'</option>'}).join('')+'</select>'+
    '<button class="btn small" data-act="pl-set">Berater und Filialen</button></div>';
  if(!db.beratungen.length)return h+'<div class="empty">Noch keine Gespräche. Sobald du eine Beratung speicherst, erscheint sie hier als Karte.</div>';
  var g=L.length,a=L.filter(function(b){return b.erg==='abschluss'}).length;
  h+='<p class="hint-t">'+g+(g===1?' Gespräch':' Gespräche')+', '+a+(a===1?' Abschluss':' Abschlüsse')+(g?' ('+Math.round(a/g*100)+' %)':'')+'. Mit dem Pfeil schiebst du eine Karte in die nächste Spalte.</p><div class="plboard">';
  ERG.forEach(function(o,ci){
    var items=L.filter(function(b){return (b.erg||'offen')===o[0]}).sort(function(x,y){return (y.ts||0)-(x.ts||0)});
    h+='<section class="plcol c-'+o[0]+'"><h3>'+o[1]+' <span>'+items.length+'</span></h3>';
    if(!items.length)h+='<div class="plempty">Leer</div>';
    items.forEach(function(b){
      var who=[b.ber,b.fil].filter(Boolean).map(esc).join(' · ');
      h+='<div class="plcard"><button class="plmain" data-act="open-ber" data-id="'+b.id+'"><span class="tag">'+esc(b.kunde)+'</span><b>'+esc(b.bereich)+'</b><small>'+whenLabel(b.datum)+(who?' · '+who:'')+(o[0]==='verloren'&&b.grund?'<br>Grund: '+esc(b.grund):'')+'</small></button>'+
        '<span class="plmv">'+(ci>0&&ci<3?'<button class="btn small" data-act="pl-move" data-id="'+b.id+'" data-to="'+ERG[ci-1][0]+'" aria-label="Zurück">←</button>':'')+
        (ci<2?'<button class="btn small primary" data-act="pl-move" data-id="'+b.id+'" data-to="'+ERG[ci+1][0]+'" aria-label="Weiter">→</button>':'')+
        (ci<2?'<button class="btn small" data-act="pl-move" data-id="'+b.id+'" data-to="verloren" aria-label="Verloren">Verloren</button>':'')+'</span></div>';
    });
    h+='</section>';
  });
  return h+'</div>';
}
function plSetSheet(){
  openSheet('<h3>Berater und Filialen</h3><p class="sub">Je eine Zeile. Nur Kürzel oder Bezeichnungen, keine Kundendaten.</p><label for="pl-b">Bankberater</label><textarea id="pl-b" rows="8">'+esc(plBer().join('\n'))+'</textarea><label for="pl-f">Filialen</label><textarea id="pl-f" rows="6">'+esc(plFil().join('\n'))+'</textarea><label for="pl-z">Zuordnung (Berater = Filiale, je Zeile)</label><textarea id="pl-z" rows="8">'+esc(Object.keys(rvZuord()).map(function(k){return k+' = '+rvZuord()[k]}).join('\n'))+'</textarea><div class="btnrow"><button class="btn" data-act="close">Abbrechen</button><button class="btn primary" data-act="pl-set-save">Speichern</button></div>');
}
function plSetSave(){
  var f=function(id){return $(id).value.split('\n').map(function(x){return x.trim().slice(0,30)}).filter(Boolean).slice(0,20)};
  if(!db.settings)db.settings={};db.settings.berater=f('pl-b');db.settings.filialen=f('pl-f');var z={};($('pl-z').value||'').split('\n').forEach(function(l){var m=l.split('=');if(m.length===2){var a=m[0].trim().slice(0,30),b=m[1].trim().slice(0,30);if(a&&b&&db.settings.berater.indexOf(a)>=0)z[a]=b}});db.settings.zuord=z;save();closeSheet();render();toast('Gespeichert');
}

/* ================= Revier (Filialen und Bankberater) ================= */
var rv={tage:'90',sel:''};
var RV_TIP={'Preis':'Erst den Nutzen in Euro zeigen (Lücke, Steuervorteil), dann den Preis nennen.','Vertrag läuft noch':'Ablaufdatum und Kündigungsfrist früh erfragen und Wiedervorlage setzen.','Kein Termin oder keine Zeit':'Kurzen Folgetermin gleich im Gespräch vereinbaren.','Bindung oder Vertrauen':'Mit dem Bankberater gemeinsam auftreten, er stellt den Kontakt her.','Bankberater':'Vorab mit dem Berater klären, wie der Termin angekündigt wird.','Sonstiges':'Gründe genauer erfassen, um Muster zu erkennen.'};
function rvZuord(){return (db.settings&&db.settings.zuord)||{}}
function rvStat(f){
  var lim=rv.tage==='alle'?'':addDaysIso(todayIso(),-Number(rv.tage));
  var L=db.beratungen.filter(function(b){return (!lim||b.datum>=lim)&&f(b)});
  var gr={};L.forEach(function(b){if(b.erg==='verloren'&&b.grund)gr[b.grund]=(gr[b.grund]||0)+1});
  var top=Object.keys(gr).sort(function(a,b){return gr[b]-gr[a]})[0]||'';
  return {g:L.length,ab:L.filter(function(b){return b.erg==='abschluss'}).length,an:L.filter(function(b){return b.erg==='angebot'}).length,offen:L.filter(function(b){return !b.erg||b.erg==='offen'}).length,top:top};
}
function rvQ(st){return st.g?Math.round(st.ab/st.g*100)+' %':'-'}
function rvTips(name,st,all){
  var t=[];
  if(!st.g)t.push('Noch keine Gespräche im Zeitraum. Beim nächsten Besuch einen Termin anbieten.');
  if(st.top&&RV_TIP[st.top])t.push('Häufigster Verlustgrund: '+st.top+'. '+RV_TIP[st.top]);
  if(st.offen)t.push(st.offen+(st.offen===1?' Gespräch hat':' Gespräche haben')+' noch kein Ergebnis. Kurz nachtragen, dann stimmt die Auswertung.');
  if(st.g>=3&&all.g&&st.ab/st.g<all.ab/all.g)t.push('Quote liegt unter dem Schnitt aller Gespräche ('+rvQ(all)+'). Vor dem nächsten Termin kurz gemeinsam vorbereiten.');
  if(st.g>=3&&all.g&&st.ab/st.g>=all.ab/all.g&&st.ab)t.push('Läuft gut: Was in diesen Terminen anders ist, lohnt sich zu notieren.');
  return t;
}
function viewRevier(){
  var all=rvStat(function(){return true}),Z=rvZuord(),bl=plBer(),fl=plFil();
  var h='<div class="plbar"><select data-rvf="tage" aria-label="Zeitraum">'+[['30','30 Tage'],['90','90 Tage'],['365','1 Jahr'],['alle','Alles']].map(function(o){return '<option value="'+o[0]+'"'+(rv.tage===o[0]?' selected':'')+'>'+o[1]+'</option>'}).join('')+'</select><button class="btn small" data-act="pl-set">Berater und Filialen</button></div>';
  h+='<p class="hint-t">'+fl.length+' Filialen, '+bl.length+' Bankberater. Antippen für Details. Nur zur Terminplanung, keine Bewertung von Personen.</p>';
  var groups=fl.map(function(f){return {f:f,b:bl.filter(function(x){return Z[x]===f})}});
  var rest=bl.filter(function(x){return fl.indexOf(Z[x])<0});
  if(rest.length)groups.push({f:'',b:rest});
  h+='<div class="rvgrid"><div class="rvmap">';
  groups.forEach(function(g){
    var st=g.f?rvStat(function(b){return b.fil===g.f}):null;
    h+='<section class="rvf"><h3><svg viewBox="0 0 22 30" width="14" height="19" aria-hidden="true"><path d="M11 30C11 30 0 18 0 11a11 11 0 0 1 22 0c0 7-11 19-11 19z" fill="currentColor"/><circle cx="11" cy="11" r="4.5" fill="var(--surface)"/></svg>'+(g.f?esc(g.f):'Nicht zugeordnet')+'</h3>'+
      (st?'<p class="rvs"><b>'+st.g+'</b> '+(st.g===1?'Gespräch':'Gespräche')+' · <b>'+st.ab+'</b> '+(st.ab===1?'Abschluss':'Abschlüsse')+' · <b>'+rvQ(st)+'</b></p>':'')+
      '<div class="rvb">'+(g.b.length?g.b.map(function(x){var q=rvStat(function(b){return b.ber===x});return '<button class="rvchip" aria-pressed="'+(rv.sel===x)+'" data-act="rv-sel" data-id="'+esc(x)+'"><i>'+esc(x.replace(/^Berater\s+/,'').slice(0,2))+'</i><span>'+esc(x)+'<small>'+q.g+' Gespräche</small></span></button>'}).join(''):'<span class="plempty">Kein Berater zugeordnet</span>')+'</div></section>';
  });
  h+='</div><aside class="rvd">';
  if(rv.sel&&bl.indexOf(rv.sel)>=0){
    var st2=rvStat(function(b){return b.ber===rv.sel}),tp=rvTips(rv.sel,st2,all);
    h+='<h3>'+esc(rv.sel)+'</h3><p class="sub">'+(Z[rv.sel]?esc(Z[rv.sel]):'Keine Filiale zugeordnet')+'</p><div class="rvk"><div><b>'+st2.g+'</b><small>Gespräche</small></div><div><b>'+st2.ab+'</b><small>Abschlüsse</small></div><div><b>'+rvQ(st2)+'</b><small>Quote</small></div></div>'+
      '<div class="pl" style="margin-top:14px">Spickzettel</div><ul class="rvl">'+tp.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>'+
      '<button class="btn primary" style="width:100%;margin-top:12px" data-act="rv-plan" data-id="'+esc(rv.sel)+'">Termin mit '+esc(rv.sel)+' planen</button>';
  }else h+='<div class="empty">Wähle links einen Bankberater.</div>';
  return h+'</aside></div>';
}

/* ================= Copilot, Wissen, Training (KI-Chat) ================= */
var CH={cp:{msgs:[],busy:false,ctl:null},wk:{msgs:[],busy:false,ctl:null},tr:{msgs:[],busy:false,ctl:null,role:'',on:false,voice:false}};
var CH_TITLE={cp:'Copilot',wk:'Wissen',tr:'Training'};
var TR_ROLES=[['skeptiker','Skeptiker','Misstrauisch, will überzeugt werden, hinterfragt jeden Nutzen.'],['preis','Preisfokus','Vergleicht nur Beiträge und sagt oft, anderswo sei es billiger.'],['zeit','Zeitknapp','Hat nur wenig Zeit, unterbricht, will die Kurzfassung.'],['bank','Mit Bankberater','Der Bankberater sitzt dabei und der Kunde schaut oft zu ihm.']];
function wissenList(){return (db.settings&&db.settings.wissen)||[]}
function getSample(cb){
  try{if(!window.claude||!window.claude.use){cb(null);return}window.claude.use('sample').then(function(f){cb(f||null)},function(){cb(null)})}catch(e){cb(null)}
}
function chFmt(t){return esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>')}
function chMsgsHtml(id){
  var c=CH[id];
  return c.msgs.map(function(m){return '<div class="cm '+m.r+'">'+(m.r==='s'?'':'')+chFmt(m.t)+'</div>'}).join('')+(c.busy&&!c.live?'<div class="cm a dim">Denkt nach ...</div>':'');
}
function chPaint(id){
  var el=$('cm-'+id);if(!el)return;el.innerHTML=chMsgsHtml(id);el.scrollTop=el.scrollHeight;
  var b=$('cs-'+id);if(b){b.textContent=CH[id].busy?'Stopp':'Senden';b.setAttribute('data-act',CH[id].busy?'chat-stop':'chat-send')}
}
function chIntro(id){
  if(id==='cp')return 'Schreib oder sprich, was passiert ist. Zum Beispiel: „Neuer Vertrag bei 10482, Hausrat, läuft am 1.1. ab" oder „10483 hat zugesagt, Rückmeldung bis Freitag". Ich lege Aufgaben, Verträge, Termine und Angebote an. Bitte nur Kundennummern, keine Namen.';
  if(id==='wk')return wissenList().length?'Frag mich etwas. Ich antworte nur aus deiner Wissensdatenbank ('+wissenList().length+' Einträge).':'Die Wissensdatenbank ist noch leer. Lege über „Einträge" Wissen an, zum Beispiel Einwandbehandlung, Produktregeln oder Abläufe. Danach beantworte ich Fragen daraus.';
  return CH.tr.on?'':'Wähle eine Kundenrolle und starte das Übungsgespräch. Du sprichst oder schreibst, die KI spielt den Kunden. Am Ende bekommst du Feedback. Es werden keine echten Kundendaten verwendet.';
}
function viewChat(id){
  var c=CH[id],h='';
  if(id==='wk')h+='<div class="plbar"><button class="btn small" data-act="wk-edit">Einträge ('+wissenList().length+')</button></div>';
  if(id==='tr'){
    h+='<div class="plbar"><button class="chip" data-act="tr-mode" data-id="drill" aria-pressed="'+(trMode==='drill')+'">Einwandtrainer</button><button class="chip" data-act="tr-mode" data-id="rolle" aria-pressed="'+(trMode==='rolle')+'">Rollenspiel</button></div>';
    if(trMode==='drill')return h+drHtml();
    h+='<div class="plbar">'+TR_ROLES.map(function(r){return '<button class="chip" data-act="tr-role" data-id="'+r[0]+'" aria-pressed="'+(c.role===r[0])+'">'+r[1]+'</button>'}).join('')+'</div>';
    h+='<div class="plbar">'+(c.on?'<button class="btn small" data-act="tr-end">Gespräch beenden und Feedback</button>':'<button class="btn small primary" data-act="tr-start">Gespräch starten</button>')+'<button class="chip" data-act="tr-voice" aria-pressed="'+!!c.voice+'">Kunde spricht laut</button></div>';
  }
  var intro=chIntro(id);

function chRun(id,extra){
  var c=CH[id];c.busy=true;c.live=false;chPaint(id);
  getSample(function(sample){
    if(!sample){c.busy=false;c.msgs.push({r:'s',t:'Die KI ist in dieser Ansicht nicht verfügbar. Öffne die Seite in Claude.'});chPaint(id);return}
    var turns=[];
    c.msgs.forEach(function(m){if(m.r==='u')turns.push({role:'user',content:m.t});else if(m.r==='a')turns.push({role:'assistant',content:m.t})});
    if(extra)turns.push({role:'user',content:extra});
    if(!turns.length||turns[0].role!=='user')turns.unshift({role:'user',content:'(Bitte beginnen)'});
    turns[0]={role:'user',content:chPrompt(id)+'\n\n---\n'+turns[0].content};
    if(turns[turns.length-1].role!=='user')turns.push({role:'user',content:'(Bitte fortfahren)'});
    var created=[],ctl=new AbortController();c.ctl=ctl;
    var opt={cache:false,signal:ctl.signal,modelTier:id==='cp'||id==='tr'?'quick':'default',onText:function(u){c.live=true;var m=c.msgs[c.msgs.length-1];if(!m||m.r!=='a'||!m.live){m={r:'a',t:'',live:true};c.msgs.push(m)}m.t=u.text;chPaint(id)}};
    if(id==='cp')opt.tools=cpTools(created);
    sample(turns,opt).then(function(res){
      c.busy=false;var m=c.msgs[c.msgs.length-1];if(m&&m.live){m.live=false;m.t=res.text}else c.msgs.push({r:'a',t:res.text});
      if(created.length)c.msgs.push({r:'s',t:'Angelegt:\n'+created.map(function(x){return '• '+x}).join('\n')});
      chPaint(id);if(id==='tr')chSpeak(res.text);if(created.length)render();
    },function(er){
      c.busy=false;var m=c.msgs[c.msgs.length-1];if(m&&m.live){m.live=false;if(!er||er.code==='cancelled'){}}
      if(!er||er.code!=='cancelled')c.msgs.push({r:'s',t:chErr(er)});
      if(created.length)c.msgs.push({r:'s',t:'Angelegt:\n'+created.map(function(x){return '• '+x}).join('\n')});
      chPaint(id);if(created.length)render();
    });
  });
}

function ergName(e){var o=ERG.filter(function(x){return x[0]===e})[0];return o?o[1]:'Offen'}
function nbRun(){
  var k=($('nb-k').value||'').trim().toUpperCase(),t=($('nb-t').value||'').trim();nb.kunde=k;nb.text=t;nb.err='';

  if(e){nb.err=e;nbSheet();return}
  nb.busy=true;nb.plan=null;nbSheet();
  getSample(function(sample){
    if(!sample){nb.busy=false;nb.err='Die KI ist in dieser Ansicht nicht verfügbar. Öffne die Seite in Claude.';nbSheet();return}
    var T=todayIso();
    var prompt='Du bereitest für einen Versicherungsvertreter die Nachbereitung eines Kundentermins auf. Heute ist '+T+'. Lies die Notiz und antworte NUR mit einem JSON-Objekt dieser Form:\n{"beratung":{"bereich":"Altersvorsorge|Geldanlage|Krankenversicherung|Sachversicherungen","erg":"offen|angebot|abschluss|verloren","grund":"Preis|Vertrag läuft noch|Kein Termin oder keine Zeit|Bindung oder Vertrauen|Bankberater|Sonstiges oder leer","notiz":"1 bis 2 Sätze, ohne Namen und Kontaktdaten"},"aufgaben":[{"text":"kurz","faellig":"YYYY-MM-DD oder leer","wartet":true/false}],"vertraege":[{"sparte":"'+SPARTEN.join('|')+'","ablauf":"YYYY-MM-DD","frist":3}],"chance":"ein Satz: welches Thema beim Kunden als nächstes Verkaufschance sinnvoll ist, oder leer"}\nRegeln: beratung weglassen (null), wenn kein Beratungsgespräch stattfand. erg=verloren nur, wenn der Kunde klar ablehnte, dann grund setzen. wartet=true, wenn auf eine Rückmeldung des Kunden gewartet wird. Relative Datumsangaben ab heute umrechnen. Nichts erfinden, was nicht in der Notiz steht. Keine Namen, Telefonnummern oder E-Mails ausgeben.\n\nNOTIZ (Kundennummer '+k+'):\n'+t;
    sample.json(prompt,{modelTier:'default'}).then(function(r){
      nb.busy=false;
      if(!r||typeof r!=='object'){nb.err='Die Auswertung war nicht lesbar. Bitte kürzer formulieren.';nbSheet();return}

      function dt(v){v=String(v||'');return /^\d{4}-\d{2}-\d{2}$/.test(v)?v:''}

      (Array.isArray(r.aufgaben)?r.aufgaben:[]).slice(0,6).forEach(function(a){var x=cl(a&&a.text);if(x)P.aufgaben.push({text:x,faellig:dt(a.faellig),wartet:!!a.wartet})});
      (Array.isArray(r.vertraege)?r.vertraege:[]).slice(0,4).forEach(function(v){var ab=dt(v&&v.ablauf);if(ab)P.vertraege.push({sparte:SPARTEN.indexOf(v.sparte)>=0?v.sparte:'Sonstiges',ablauf:ab,frist:[1,2,3,6].indexOf(Number(v.frist))>=0?Number(v.frist):3})});
      P.chance=cl(r.chance);
      if(!P.beratung&&!P.aufgaben.length&&!P.vertraege.length&&!P.chance){nb.err='Daraus konnte ich nichts ableiten. Bitte genauer beschreiben.';nbSheet();return}
      nb.plan=P;nbSheet();
    },function(er){nb.busy=false;nb.err=chErr(er);nbSheet()});
  });
}
function nbApply(){

}
