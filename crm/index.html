<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beratungsplattform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
<style>
/* ===== Designsystem: Grundwerte =====
   Schrift: Inter für die Oberfläche, Newsreader nur für Leitfragen und Kernaussagen im Gespräch.
   Abstände: 4 · 8 · 12 · 16 · 24 · 32 · 48. Radien: 8 · 12 · 18.
   Farben tragen Bedeutung: primary = Auswahl/Aktion, ok = gedeckt/entlastet, warn = prüfen, late = Lücke/überfällig. */
:root{
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --font-serif:"Newsreader",Georgia,"Times New Roman",serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;
  --r-s:8px;--r:12px;--r-l:18px;
  --bg:#F4F6F9;--surface:#FFFFFF;--surface-2:#F8F9FB;--sunken:#EEF1F5;--line:#E3E7ED;--line-2:#CBD3DE;
  --ink:#101B30;--ink-2:#34425A;--muted:#5E6C84;
  --brand:#0F2747;--brand-2:#173761;--brand-ink:#E8EEF8;--brand-muted:#9FB0CA;
  --primary:#2B50C8;--primary-strong:#1F3EA3;--primary-soft:#E9EEFC;--primary-ink:#FFFFFF;
  --ok:#1D7650;--ok-soft:#E2F2E9;--warn:#995A06;--warn-soft:#FCEFD9;--late:#B42318;--late-soft:#FCE9E7;--violet:#6650B0;--violet-soft:#EEEAFA;
  --shadow-1:0 1px 2px rgba(16,27,48,.06),0 1px 1px rgba(16,27,48,.03);
  --shadow-2:0 6px 20px rgba(16,27,48,.08),0 1px 3px rgba(16,27,48,.05);
  --shadow-3:0 18px 50px rgba(16,27,48,.18);
  --focus:0 0 0 3px rgba(43,80,200,.35);
  /* Aliasse für bestehende Bausteine */
  --accent:var(--primary);--accent-ink:var(--primary-ink);--chip:var(--sunken);--cta:var(--primary);--cta-ink:var(--primary-ink);
  --amber:#C27A0E;--orange:#C27A0E;--c-alter:#B7791F;--c-anlage:var(--ok);--c-late-bg:var(--late-soft);--c-anlage-bg:var(--ok-soft);--c-warn-bg:var(--warn-soft);--font-d:var(--font);--r-legacy:12px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1120;--surface:#121A2B;--surface-2:#161F33;--sunken:#1A2539;--line:#243049;--line-2:#34425E;
    --ink:#E7ECF5;--ink-2:#C3CDDD;--muted:#94A2B9;--brand:#0A1428;--brand-2:#13213D;
    --primary:#7D9BFF;--primary-strong:#A3B8FF;--primary-soft:#1D2A4C;--primary-ink:#0B1120;
    --ok:#5EC290;--ok-soft:#11301F;--warn:#E5AA4D;--warn-soft:#33250E;--late:#F28B7E;--late-soft:#3A1916;--violet:#B5A4F0;--violet-soft:#2A2343;
    --shadow-1:none;--shadow-2:0 6px 20px rgba(0,0,0,.35);--focus:0 0 0 3px rgba(125,155,255,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1120;--surface:#121A2B;--surface-2:#161F33;--sunken:#1A2539;--line:#243049;--line-2:#34425E;
  --ink:#E7ECF5;--ink-2:#C3CDDD;--muted:#94A2B9;--brand:#0A1428;--brand-2:#13213D;
  --primary:#7D9BFF;--primary-strong:#A3B8FF;--primary-soft:#1D2A4C;--primary-ink:#0B1120;
  --ok:#5EC290;--ok-soft:#11301F;--warn:#E5AA4D;--warn-soft:#33250E;--late:#F28B7E;--late-soft:#3A1916;--violet:#B5A4F0;--violet-soft:#2A2343;
  --shadow-1:none;--shadow-2:0 6px 20px rgba(0,0,0,.35);--focus:0 0 0 3px rgba(125,155,255,.45);
  color-scheme:dark;
}

/* ===== Basis und Bausteine ===== */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.5 var(--font);font-feature-settings:"cv11","ss01";font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
:focus-visible{outline:none;box-shadow:var(--focus);border-radius:var(--r-s)}
[hidden]{display:none!important}
h1,h2,h3,h4{color:var(--ink);letter-spacing:-.015em;line-height:1.2}
a{color:var(--primary)}
.skip{position:absolute;left:-999px;top:8px;z-index:100;background:var(--surface);padding:8px 12px;border-radius:8px}.skip:focus{left:8px}
.muted{color:var(--muted)}.sm{font-size:13px}
.eyebrow{margin:0 0 4px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg{flex:none}

/* Schaltflächen */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:var(--r);border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:600;font-size:15px;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:var(--surface-2);border-color:var(--muted)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.primary:hover{background:var(--primary-strong);border-color:var(--primary-strong)}
.btn.cta{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.small{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.big{min-height:52px;font-size:16px}
.btn.danger{color:var(--late);border-color:color-mix(in srgb,var(--late) 35%,var(--line))}
.btn.block{width:100%}
.btn.on{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}
.btn:disabled{opacity:.45;cursor:default}
.btn.rec{background:var(--late);border-color:var(--late);color:#fff}
.btnrow{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}.btnrow .btn{flex:1 1 auto}.btnrow.stack{flex-direction:column}.btnrow.wrap .btn{flex:0 1 auto}
.lnk{display:inline-flex;align-items:center;gap:6px;color:var(--primary);font-weight:600;font-size:14px;min-height:32px;border-radius:8px}
.lnk:hover{text-decoration:underline}
.lnk.back{margin:0 0 12px;color:var(--muted)}
.linkbtn{color:var(--primary);font-weight:600;font-size:14px;min-height:32px}
.icon{display:grid;place-items:center;width:40px;height:40px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.icon.sm{width:30px;height:30px;font-size:18px;border:0;background:transparent;color:var(--muted)}

/* Chips und Auswahl */
.chips,.lwc{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:6px 14px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-size:14.5px;font-weight:500}
.chip:hover{border-color:var(--primary)}
.chip[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--primary-ink);font-weight:600}
.chip[data-v=ja][aria-pressed=true]{background:var(--ok);border-color:var(--ok);color:#fff}
.chip[data-v=teil][aria-pressed=true]{background:var(--warn);border-color:var(--warn);color:#fff}
.chip[data-v=nein][aria-pressed=true]{background:var(--late);border-color:var(--late);color:#fff}
.chip[data-v=unklar][aria-pressed=true]{background:#4E5D7A;border-color:#4E5D7A;color:#fff}
.chip[data-v=kb][aria-pressed=true]{background:#7B8698;border-color:#7B8698;color:#fff}
.chip[data-v=pref][aria-pressed=true]{background:var(--violet);border-color:var(--violet);color:#fff}
.seg{display:flex;gap:4px;padding:4px;border-radius:var(--r);background:var(--sunken)}
.seg button{flex:1;min-height:38px;border-radius:9px;font-size:14px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:650;box-shadow:var(--shadow-1)}

/* Formulare */
label{display:block;font-size:14px;font-weight:600;margin:14px 0 6px;color:var(--ink-2)}
.fl{display:block;margin:14px 0 0;font-size:14px;font-weight:600;color:var(--ink-2)}
.fl>span:first-child{display:block;margin-bottom:6px}
.fl small{display:block;font-weight:400;color:var(--muted);font-size:13px;margin-top:5px}
.fi{display:flex;align-items:center;gap:8px}.fi em{font-style:normal;font-weight:500;color:var(--muted);font-size:13px;white-space:nowrap}
.opt{font-style:normal;font-weight:400;color:var(--muted);font-size:12.5px;margin-left:4px}
input[type=text],input[type=search],input[type=date],input[type=time],input[type=number],select,textarea{width:100%;min-height:44px;padding:10px 12px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-size:15.5px;transition:border-color .12s,box-shadow .12s}
input:hover,select:hover,textarea:hover{border-color:var(--muted)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:var(--focus)}
textarea{min-height:88px;resize:vertical;line-height:1.5}
input::placeholder,textarea::placeholder{color:color-mix(in srgb,var(--muted) 75%,transparent)}
.ck{display:flex;align-items:center;gap:10px;margin:10px 0;font-weight:500;font-size:15px;color:var(--ink)}
.ck input{width:20px;height:20px;flex:none;accent-color:var(--primary)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.grid2>.fl,.grid2>div>label:first-child{margin-top:14px}
.hint-t{font-size:13.5px;color:var(--muted);margin:6px 0 0;line-height:1.5}
.err{color:var(--late);font-size:14px;font-weight:600;margin:12px 0 0}
.searchf{display:flex;align-items:center;gap:8px;margin:0;padding:0 12px;min-height:44px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);color:var(--muted);font-weight:400}
.searchf input{border:0;min-height:42px;padding:0;background:transparent;box-shadow:none!important}
.searchf:focus-within{border-color:var(--primary);box-shadow:var(--focus)}
.searchf.big{min-height:52px;font-size:16px}
details.adv{margin:16px 0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
details.adv>summary{cursor:pointer;padding:12px 16px;font-weight:600;font-size:14.5px;list-style:none;display:flex;align-items:center;gap:8px}
details.adv>summary::before{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s}
details.adv[open]>summary::before{transform:rotate(45deg)}
details.adv>summary::-webkit-details-marker{display:none}
details.adv>*:not(summary){margin-left:16px;margin-right:16px}
details.adv[open]{padding-bottom:12px}

/* Statusanzeigen */
.stat-pill{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--sunken);color:var(--muted);white-space:nowrap;line-height:1.6}
.s-ok{background:var(--ok-soft);color:var(--ok)}.s-late{background:var(--late-soft);color:var(--late)}.s-warn{background:var(--warn-soft);color:var(--warn)}
.s-info,.s-run{background:var(--primary-soft);color:var(--primary)}.s-new{background:var(--violet-soft);color:var(--violet)}.s-done{background:var(--sunken);color:var(--ink-2)}.s-muted{background:var(--sunken);color:var(--muted)}
.s-ki{background:var(--violet-soft);color:var(--violet)}
.badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:6px;background:var(--sunken);color:var(--ink-2);font-size:12.5px;font-weight:600}
.tag{display:inline-flex;align-items:center;padding:2px 9px;border-radius:6px;background:var(--primary-soft);color:var(--primary);font-weight:650;font-size:13.5px}
.pill{font-size:12.5px;font-weight:600;padding:2px 10px;border-radius:999px;background:var(--sunken);color:var(--muted)}
.pill.offen{color:var(--primary)}.pill.nachgefasst{color:var(--warn)}.pill.abgeschlossen{color:var(--ok)}.pill.wait{background:var(--warn-soft);color:var(--warn)}.pill.kuend{background:var(--late-soft);color:var(--late)}
.note{background:var(--primary-soft);border-radius:var(--r);padding:12px 16px;font-size:14.5px;margin:0 0 12px;border-left:4px solid var(--primary)}
.note.ok{background:var(--ok-soft);border-left-color:var(--ok)}
.banner{max-width:1240px;margin:0 auto;padding:0 32px}.banner .note{margin-top:12px}
.empty,.empty-s{border:1px dashed var(--line-2);border-radius:var(--r);padding:20px;text-align:center;color:var(--muted);background:var(--surface-2)}
.empty-s p{margin:0 0 10px}.empty-s p:last-child{margin:0}
.fine-s{font-size:12.5px;color:var(--muted);margin:10px 0 0}

/* Dialog und Meldung */
#sheet{position:fixed;inset:0;z-index:60}
.backdrop{position:absolute;inset:0;background:rgba(10,18,34,.45);backdrop-filter:blur(2px)}
.panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(680px,calc(100% - 32px));max-height:88vh;overflow:auto;background:var(--surface);border-radius:var(--r-l);padding:24px 28px 28px;box-shadow:var(--shadow-3);animation:pop .16s ease-out}
@keyframes pop{from{opacity:.4;transform:translate(-50%,-48%)}to{opacity:1;transform:translate(-50%,-50%)}}
.grab{display:none}
.panel h3{margin:0 0 8px;font-size:21px}
.panel h4{margin:22px 0 8px;font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:80;max-width:min(560px,calc(100% - 32px));background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:var(--r);display:flex;align-items:center;gap:14px;box-shadow:var(--shadow-3);font-size:14.5px}
#toast button{color:var(--bg);text-decoration:underline;font-weight:650}
@media (max-width:640px){.panel{left:0;right:0;top:auto;bottom:0;transform:none;width:100%;max-height:92vh;border-radius:20px 20px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px));animation:up .18s ease-out}.grab{display:block;width:40px;height:4px;border-radius:2px;background:var(--line-2);margin:0 auto 12px}#toast{bottom:84px}}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== Seitenrahmen und Navigation ===== */
.nav{position:fixed;left:0;top:0;bottom:0;width:248px;z-index:20;background:var(--brand);color:var(--brand-ink);display:flex;flex-direction:column;padding:18px 12px;gap:4px;overflow:auto}
.nav-brand{display:flex;align-items:center;gap:12px;padding:6px 10px 22px}
.nav-brand b{display:block;font-size:15px;color:#fff;letter-spacing:-.01em}.nav-brand small{display:block;font-size:12px;color:var(--brand-muted)}
.nav-logo{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:linear-gradient(140deg,#5B7CF0,#2B50C8);color:#fff}
.nav-g{display:flex;flex-direction:column;gap:2px}
.nav-h{padding:18px 12px 6px;font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--brand-muted)}
.nav-i{display:flex;align-items:center;gap:12px;width:100%;min-height:42px;padding:0 12px;border-radius:10px;color:#C9D4E6;font-size:14.5px;font-weight:500}
.nav-i:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-i[aria-current="page"]{background:rgba(255,255,255,.12);color:#fff;font-weight:650;box-shadow:inset 3px 0 0 #8EA6FF}
.nav-foot{margin-top:auto;padding-top:12px;border-top:1px solid rgba(255,255,255,.08)}
.shell{margin-left:248px;min-height:100vh}
.top{position:sticky;top:0;z-index:15;display:flex;align-items:center;gap:20px;padding:14px 32px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid transparent}
.top-t{min-width:0}.top h1{margin:0;font-size:20px;font-weight:700}.top p{margin:0;font-size:13px;color:var(--muted)}
.top-search{margin-left:auto;display:flex;align-items:center;gap:10px;width:min(420px,40vw);min-height:42px;padding:0 12px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:14px;box-shadow:var(--shadow-1)}
.top-search:hover{border-color:var(--line-2)}
.top-search kbd{margin-left:auto;font:12px var(--font);padding:2px 6px;border:1px solid var(--line);border-radius:6px;color:var(--muted)}
.ic-s{display:flex}
.topbtns{display:flex;gap:8px}.only-m{display:none}
main.view{max-width:1240px;margin:0 auto;padding:8px 32px 64px}
.bnav{display:none}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:30;width:56px;height:56px;border-radius:18px;background:var(--primary);color:var(--primary-ink);display:none;place-items:center;box-shadow:var(--shadow-3)}

/* Karten-Abschnitte */
.card-s{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:20px 22px;margin:0 0 20px;box-shadow:var(--shadow-1)}
.cs-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 14px}
.cs-h h2{margin:0;font-size:16.5px;display:flex;align-items:center;gap:8px}
.cnt{display:inline-grid;place-items:center;min-width:24px;height:22px;padding:0 7px;border-radius:999px;background:var(--sunken);color:var(--ink-2);font-size:12.5px;font-weight:650}
.sub-h{margin:16px 0 8px;font-size:12.5px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}.sub-h.late{color:var(--late)}
.sec-t{margin:32px 0 14px;font-size:18px}
.dash{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:20px;align-items:start}
.more-n{margin:8px 0 0;font-size:13.5px;color:var(--muted)}

/* Startseite */
.hello{display:grid;grid-template-columns:minmax(0,1fr) 300px;align-items:center;gap:24px;margin:8px 0 24px;padding:28px 32px;border-radius:24px;background:linear-gradient(135deg,var(--surface) 0%,var(--primary-soft) 140%);border:1px solid var(--line);box-shadow:var(--shadow-1)}
.hello h2{margin:0 0 6px;font-size:30px;font-weight:700;letter-spacing:-.025em}
.hello-s{margin:0 0 18px;color:var(--ink-2);font-size:16px}
.hello-ill svg{display:block;width:100%;height:auto;border-radius:18px}
.quick{display:flex;flex-wrap:wrap;gap:10px}
.qbtn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line-2);font-weight:600;font-size:14.5px;color:var(--ink)}
.qbtn:hover{border-color:var(--primary);color:var(--primary)}
.qbtn.pri{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}.qbtn.pri:hover{background:var(--primary-strong);color:var(--primary-ink)}
.qbtn svg{color:inherit}
.appts{display:flex;flex-direction:column;gap:12px}
.appt{display:grid;grid-template-columns:76px minmax(0,1fr);gap:16px;padding:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2)}
.appt-time{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:10px;background:var(--surface);border:1px solid var(--line);padding:10px 4px;text-align:center;align-self:start}
.appt-time b{font-size:18px;letter-spacing:-.02em}.appt-time span{font-size:12px;color:var(--muted)}
.appt-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.kn{font-weight:700;font-size:16px;color:var(--ink)}.kn:hover{color:var(--primary);text-decoration:underline}
.appt-sub{margin:4px 0 0;font-size:14px;color:var(--ink-2)}
.appt-prep{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.appt-prep li{font-size:12.5px;padding:3px 9px;border-radius:999px;background:var(--warn-soft);color:var(--warn);font-weight:600}
.appt-next{margin:10px 0 0;font-size:14px}.appt-next span{display:block;font-size:11.5px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.appt-act{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.task{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;text-align:left}
.task-t{font-weight:550;font-size:15px;color:var(--ink)}.task-b:hover .task-t{color:var(--primary)}
.task-m{font-size:13px;color:var(--muted)}.task-m b{color:var(--ink-2)}
.task.late .task-m{color:var(--late)}.task.today .task-m{color:var(--warn)}.task.done .task-t{text-decoration:line-through;color:var(--muted)}
.prio{display:inline-grid;place-items:center;width:18px;height:18px;margin-right:6px;border-radius:5px;background:var(--late);color:#fff;font-style:normal;font-size:12px;font-weight:800;vertical-align:1px}
.dot-i{display:grid;place-items:center;width:26px;height:26px;flex:none;border-radius:8px;background:var(--sunken);color:var(--muted)}
.check{position:relative;flex:none;width:24px;height:24px;margin-top:1px;border-radius:7px;border:2px solid var(--line-2);background:var(--surface)}
.check::after{content:"";position:absolute;inset:-10px}
.check:hover{border-color:var(--ok);background:var(--ok-soft)}
.runs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.run>button{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2);text-align:left}
.run>button:hover{border-color:var(--primary);background:var(--surface)}
.run-ic{display:grid;place-items:center;width:42px;height:42px;flex:none;border-radius:12px;background:var(--primary-soft);color:var(--primary)}
.run-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.run-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.run-h b{font-size:15.5px}
.run-m,.run-d{font-size:13.5px;color:var(--muted)}.run-n{font-size:13.5px;color:var(--ink-2)}
.run-p{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-2)}
.bar{display:block;width:90px;height:6px;border-radius:3px;background:var(--line);overflow:hidden;flex:none}.bar i{display:block;height:100%;border-radius:3px;background:var(--primary)}
.agreed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.agreed button{display:flex;flex-wrap:wrap;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line)}
.list-s{list-style:none;margin:0;padding:0}
.list-s li{border-top:1px solid var(--line)}.list-s li:first-child{border-top:0}
.list-s li>button,.list-s li>span{display:flex;flex-direction:column;gap:2px;width:100%;padding:10px 0;text-align:left}
.list-s b{font-size:14.5px;font-weight:600}.list-s span span,.list-s button span{font-size:13px;color:var(--muted)}.list-s small{font-size:13px;color:var(--ink-2)}
.list-s button:hover b{color:var(--primary)}
.list-s .stat-pill{align-self:flex-start;margin-top:4px}

/* Kunden */
.toolbar{display:flex;gap:12px;margin:8px 0 20px}.toolbar .searchf{flex:1}
.clist{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.ccard{display:flex;align-items:center;gap:14px;padding:16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-1);text-align:left}
.ccard:hover{border-color:var(--primary)}
.avatar{display:grid;place-items:center;width:44px;height:44px;flex:none;border-radius:14px;background:linear-gradient(140deg,var(--primary-soft),var(--sunken));color:var(--primary);font-weight:700;font-size:15px}
.avatar.xl{width:72px;height:72px;border-radius:22px;font-size:24px}
.cc-b{flex:1;min-width:0;display:flex;flex-direction:column}.cc-n{font-weight:700;font-size:16px}.cc-m{font-size:13.5px;color:var(--muted)}
.cc-t{display:flex;flex-direction:column;align-items:flex-end;gap:4px}.cc-t small{font-size:12.5px;color:var(--muted)}
.profile{display:flex;align-items:center;gap:20px;padding:24px;border-radius:var(--r-l);background:var(--surface);border:1px solid var(--line);margin:0 0 16px;box-shadow:var(--shadow-1)}
.pf-t{flex:1;min-width:0}.pf-t h2{margin:0;font-size:28px}.pf-t p{margin:4px 0 0}
.pf-a{display:flex;flex-wrap:wrap;gap:8px}
.facts-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:0 0 20px}
.facts-row div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}.facts-row b{display:block;font-size:22px}.facts-row span{font-size:13px;color:var(--muted)}
.needs{list-style:none;margin:0;padding:0}
.needs li{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}.needs li:first-child{border-top:0}
.nd-ic{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--sunken);color:var(--primary)}
.nd-t{flex:1;display:flex;flex-direction:column}.nd-t small{color:var(--muted);font-size:12.5px}
.danger-z{margin-top:8px;text-align:right}

/* Bestehende Listen (Aufgaben, Angebote, Pipeline) */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:12px}
.row{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--surface);position:relative}
.list .row:last-child{border-bottom:0}
.row:not(.list .row){border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px}
.row.late{box-shadow:inset 3px 0 0 var(--late)}.row.today{box-shadow:inset 3px 0 0 var(--warn)}.row.soon{box-shadow:inset 3px 0 0 var(--primary)}
.row .body{flex:1;min-width:0;cursor:pointer}
.line1{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.when{font-size:13px;color:var(--muted)}.row.late .when{color:var(--late);font-weight:600}
.txt{margin-top:4px;font-size:15px;word-break:break-word}.sub{font-size:13.5px;color:var(--muted);margin-top:2px;word-break:break-word}
.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.group{margin:22px 0 10px;font-size:12.5px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);display:flex;gap:8px;align-items:baseline}
.group.now{color:var(--late)}.group.week{color:var(--primary)}.group span{color:var(--muted);font-weight:500}
.card{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:8px}
.card .head{display:flex;justify-content:space-between;gap:8px;align-items:center}
.mini{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}.mini .body{flex:1;cursor:pointer}
.hints{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin:0 0 12px}
.hints summary{list-style:none;cursor:pointer;padding:12px 16px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.hints summary::-webkit-details-marker{display:none}
.hints .count{background:var(--primary);color:var(--primary-ink);border-radius:999px;font-size:12.5px;padding:1px 9px}
.hint{border-top:1px solid var(--line);padding:12px 16px;font-size:14.5px}.hints .fine{font-size:12.5px;color:var(--muted);padding:0 16px 12px}
.plbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.plbar select{width:auto}
.plboard{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:start}
.plcol{background:var(--sunken);border-radius:var(--r-l);padding:12px;display:flex;flex-direction:column;gap:8px;border-top:4px solid var(--primary)}
.plcol.c-angebot{border-top-color:var(--amber)}.plcol.c-abschluss{border-top-color:var(--ok)}.plcol.c-verloren{border-top-color:var(--late)}
.plcol h3{margin:2px 4px 6px;font-size:15px;display:flex;justify-content:space-between}
.plcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow-1)}
.plmain{display:flex;flex-direction:column;gap:4px;text-align:left}.plmain small{color:var(--muted);font-size:12.5px}
.plmv{display:flex;gap:6px;flex-wrap:wrap}.plempty{color:var(--muted);font-size:13px;padding:8px 4px}
.rvgrid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
.rvmap{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.rvf{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px}
.rvf h3{margin:0;font-size:15.5px;display:flex;align-items:center;gap:8px}.rvf h3 svg{color:var(--primary)}
.rvs{margin:0;font-size:13px;color:var(--muted)}.rvs b{color:var(--ink)}.rvb{display:flex;flex-direction:column;gap:6px}
.rvchip{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);border-radius:10px;padding:6px 10px;min-height:48px;background:var(--surface-2)}
.rvchip[aria-pressed=true]{border-color:var(--primary);background:var(--primary-soft)}
.rvchip i{font-style:normal;width:30px;height:30px;border-radius:50%;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;font-weight:700;font-size:12px}
.rvchip span{display:flex;flex-direction:column;font-weight:600;font-size:14px}.rvchip small{font-weight:400;color:var(--muted);font-size:12px}
.rvd{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:18px;position:sticky;top:84px}.rvd h3{margin:0;font-size:20px}
.rvk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.rvk div{background:var(--sunken);border-radius:10px;padding:10px}.rvk b{display:block;font-size:20px}.rvk small{color:var(--muted);font-size:12px}
.rvl{padding-left:18px;margin:8px 0 0;font-size:14px}
.pl{font-size:12px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
#sheetbody .tools{grid-template-columns:1fr 1fr}
.tl2{display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-height:64px;color:var(--ink);margin:0;font-weight:400}
.tl2:hover{border-color:var(--primary)}
.tl2 strong{display:block;font-size:14.5px}.tl2 small{display:block;color:var(--muted);font-size:12.5px;line-height:1.35;margin-top:2px}
.tli{flex:none;width:38px;height:38px;border-radius:10px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center}
.dsec{display:flex;justify-content:space-between;align-items:baseline;margin:20px 0 10px}.dsec h3{margin:0;font-size:12.5px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.more-f{margin:24px 0}.more-f summary{cursor:pointer;font-weight:600;color:var(--muted);padding:8px 0}
.srr{display:flex;flex-direction:column;align-items:flex-start;text-align:left;width:100%;gap:2px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:6px}.srr small{color:var(--muted);font-size:12.5px}
.search{margin:6px 0 14px}
.tl3{display:flex;flex-direction:column;border-left:2px solid var(--line);margin:4px 0 4px 6px}
.tle{position:relative;display:flex;gap:10px;align-items:baseline;text-align:left;padding:7px 4px 7px 16px;color:var(--ink);font-size:14px}
.tle i{position:absolute;left:-6px;top:13px;width:10px;height:10px;border-radius:50%;background:var(--primary)}
.tle.c-a i{background:var(--amber)}.tle.c-v i{background:var(--late)}.tle.c-o i{background:var(--muted)}.tle.c-t i{background:var(--ok)}
.tld{flex:none;width:86px;color:var(--muted);font-size:12.5px}
/* Chat */
.chat{display:flex;flex-direction:column;gap:12px;max-width:820px}
.cmsgs{display:flex;flex-direction:column;gap:10px;min-height:260px;max-height:calc(100vh - 340px);overflow:auto;padding:4px 2px}
.cm{max-width:86%;padding:10px 14px;border-radius:16px;font-size:15px;line-height:1.5}
.cm.u{align-self:flex-end;background:var(--primary);color:var(--primary-ink);border-bottom-right-radius:4px}
.cm.a{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.cm.s{align-self:stretch;max-width:100%;background:var(--ok-soft);font-size:13.5px}.cm.i{align-self:stretch;max-width:100%;color:var(--muted);font-size:14.5px;padding-left:0}.cm.dim{color:var(--muted)}
.cbar{display:flex;gap:8px;align-items:flex-end}.cbar textarea{flex:1;min-height:52px;resize:none}.cbar .btn{min-height:52px}
.nbp{display:flex;flex-direction:column;gap:8px}.nbr{display:flex;gap:10px;align-items:flex-start;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}.nbr input{margin-top:4px;width:18px;height:18px}.nbr span{display:flex;flex-direction:column;font-size:14.5px}.nbr small{color:var(--muted);font-size:12.5px}
/* Kennzahlen und Rechner-Ausgaben */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:12px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat .sl{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.stat .sv{font-size:22px;font-weight:700;letter-spacing:-.02em;margin-top:2px}.stat .ss{font-size:12.5px;color:var(--muted)}
.stat.bad .sv{color:var(--late)}.stat.good .sv{color:var(--ok)}.stat.grow .sv{color:var(--primary)}
.si{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:7px}.stat.bad .si{background:var(--late-soft);color:var(--late)}.stat.good .si,.stat.grow .si{background:var(--primary-soft);color:var(--primary)}
.wk,.wk3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.chartbox{background:#fff;border:1px solid var(--line);border-radius:var(--r);margin:12px 0;overflow:hidden}.chartbox canvas{display:block}
.pbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 14px 14px;margin:12px 0}
.mrow{border-top:1px solid var(--line);padding:10px 0}
.mname{display:flex;gap:6px;align-items:center}.mname input{font-weight:600}
.mname .x{font-size:22px;width:40px;min-height:40px;color:var(--muted);border-radius:8px}
.mcols{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}.mcols small{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}.mcols input,.mcols select{margin-top:6px}
select[data-amp]{border-left:5px solid var(--line-2)}
select[data-amp="ja"],select[data-amp="voll"],select[data-amp="wichtig"]{border-left-color:var(--ok)}select[data-amp="teil"],select[data-amp="gkv"],select[data-amp="egal"]{border-left-color:var(--amber)}select[data-amp="nein"],select[data-amp="keine"],select[data-amp="sorge"]{border-left-color:var(--late)}select[data-amp="zus"]{border-left-color:var(--primary)}
.letterbox{border:1px solid var(--line);border-radius:var(--r);padding:16px;background:var(--surface)}.letterbox pre{white-space:pre-wrap;font:inherit;margin:8px 0 0}.letterbox .lsub{font-weight:650;margin-bottom:10px}.letterbox .lbody{font-size:15px}
.sh{margin:6px 0 6px;font-size:20px}.sh2{margin:22px 0 8px;font-size:12.5px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.tw{overflow-x:auto}.pft{border-collapse:collapse;width:100%;font-size:14.5px}.pft th,.pft td{padding:9px 8px;border-top:1px solid var(--line);text-align:right}.pft th:first-child{text-align:left;font-weight:600}.pft thead th{border-top:0;font-size:13px;color:var(--muted)}.pft .hl{background:var(--primary-soft);font-weight:700}
.layers{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.layer{border-radius:var(--r);padding:14px 16px;background:var(--sunken);color:var(--muted);border:2px dashed var(--line-2);display:flex;flex-direction:column;gap:3px}.layer b{font-size:17px}.layer span{font-size:14.5px}
.layer.on{border-style:solid;color:#fff;border-color:transparent}.layer.l1.on{background:#25507A}.layer.l2.on{background:#1F7A8C}.layer.l3.on{background:#6650B0}
.vpb{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 16px;margin:10px 0}.vpb h4{margin:0 0 6px;font-size:16px}
.vpr{display:grid;grid-template-columns:1fr 170px;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}.vpr:first-of-type{border-top:0}
.vpi{font-size:14px;color:var(--ink-2);margin:6px 0 12px;padding:12px 14px;background:var(--surface-2);border-radius:10px}
.ueg{margin:20px 0 6px;font-size:12.5px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.uer{display:grid;grid-template-columns:1fr;gap:6px;padding:10px 0;border-top:1px solid var(--line)}.uer span.n{font-size:16px;font-weight:550;display:flex;align-items:center}
.uer .chip{font-size:13.5px;padding:4px 10px;min-height:34px}.uer.flash{background:var(--primary-soft);border-radius:10px}
.ui{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--primary-soft);color:var(--primary);margin-right:10px;font-style:normal}
.sw{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px;margin:8px 0}
.sw[aria-pressed=true]{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary);background:var(--primary-soft)}
.sw strong{display:block;font-size:16px}.sw small{color:var(--muted)}
.sw .sd{width:12px;height:12px;border-radius:50%;background:var(--line-2)}.sw .sd.ja{background:var(--ok)}.sw .sd.teil{background:var(--amber)}.sw .sd.nein{background:var(--late)}
.bsl{margin:12px 0}.bsr{display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.bsr .bsg{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;font-weight:700;font-size:13px}
.bsr b{display:block;font-size:15px}.bsr small{color:var(--muted);font-size:13.5px}
.bs-hand .bsg{border-color:var(--late);color:var(--late)}.bs-fertig .bsg{border-color:var(--ok);color:var(--ok)}
.ll{margin:6px 0 14px}.llh{font-weight:700;font-size:15px;margin-bottom:8px}.llg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.llg.one{grid-template-columns:1fr}
.llb{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;background:var(--surface)}.llb.on{border:2px solid var(--primary);background:var(--primary-soft)}
.llt{display:flex;gap:10px;align-items:center;margin-bottom:6px}.llt small{display:block;color:var(--muted);font-size:12.5px}.llt em{margin-left:auto;font-style:normal;font-size:12px;font-weight:700;color:var(--primary-ink);background:var(--primary);border-radius:999px;padding:2px 8px}
.lln{flex:none;width:26px;height:26px;border-radius:50%;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;font-weight:700}
.llk{display:flex;gap:6px;align-items:center;width:100%;text-align:left;padding:6px 2px;font-size:14.5px;min-height:34px}
.lls{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;font-size:11px;font-weight:700}
.lls.s-ja{border-color:var(--ok);color:var(--ok);background:none}.lls.s-teil{border-color:var(--amber);color:var(--amber);background:none}.lls.s-nein{border-color:var(--late);color:var(--late);background:none}.lls.s-unklar{border-color:#4E5D7A;color:#4E5D7A;background:none}
.lli{display:inline-grid;color:var(--muted)}.llp{font-size:13px;color:var(--muted);margin:6px 0 0}
.lw{margin-bottom:16px}.lwg{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:var(--r);padding:10px 12px;margin-top:8px}.lwg>b{font-size:20px;color:var(--amber)}.lwg>div{flex:1;display:flex;flex-direction:column}.lwg span{font-size:13px;color:var(--muted)}
.ganzcard{margin-top:18px;padding:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.gz{display:flex;flex-direction:column;margin-top:8px}.gzr{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}

/* Korrektur-Modus */

.fbbar{display:flex;align-items:center;gap:8px;max-width:560px;margin:8px auto 0;background:#E11D48;color:#fff;border-radius:12px;padding:8px 10px;font-size:13.5px;font-weight:600}.fbbar span{flex:1}

/* Pflege-Bausteine (ds-) */
.ds-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:16px 18px;margin:0 0 12px}
.ds-cap{font-size:12px;letter-spacing:.07em;text-transform:uppercase;font-weight:650;color:var(--muted);margin:0 0 10px}
.ds-facts{margin:0}
.ds-facts>div{display:grid;grid-template-columns:minmax(120px,1fr) minmax(0,1.3fr);gap:12px;padding:8px 0;border-top:1px solid var(--line)}.ds-facts>div:first-child{border-top:0;padding-top:0}
.ds-facts dt{color:var(--muted);font-size:14px}.ds-facts dd{margin:0;font-weight:600;text-align:right;font-size:14.5px}
.ds-list{margin:0;padding-left:20px;font-size:15px;line-height:1.55}.ds-list li{margin:4px 0}.ds-list.sm{font-size:13.5px}
.ds-q{margin:0 0 18px}.ds-q>span{display:block;font-weight:600;font-size:15px;margin-bottom:2px}
.ds-callout{border-radius:var(--r);padding:12px 16px;margin:0 0 12px;background:var(--primary-soft);border-left:4px solid var(--primary);font-size:15px;line-height:1.5}
.ds-callout.bad{border-left-color:var(--late);background:var(--late-soft)}.ds-callout.good{border-left-color:var(--ok);background:var(--ok-soft)}
.ds-source{font-size:12.5px;color:var(--muted);margin:6px 0 14px;line-height:1.5}
.ds-quote{margin:10px 0 4px;font-family:var(--font-serif);font-size:18px;font-style:italic}
.ds-rank i{font-style:normal;display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--primary-ink);color:var(--primary);font-weight:800;font-size:12px;margin-right:4px}
.ds-rank-list{margin:0;padding-left:22px;font-size:16px;font-weight:600;line-height:1.7}
.ds-grade{display:grid;gap:6px;margin:6px 0 4px}.ds-grade>div{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:baseline;padding:8px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:14.5px}.ds-grade b{font-size:13px;color:var(--primary)}
.ds-conseq{display:grid;gap:10px;margin:0 0 8px}.ds-conseq>div{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}.ds-conseq span{font-size:14px;color:var(--muted)}
.ds-calc{width:100%;border-collapse:collapse;margin:4px 0 0;font-size:14.5px}
.ds-calc th{text-align:left;font-weight:600;padding:8px 0;border-top:1px solid var(--line)}.ds-calc th small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.ds-calc td{text-align:right;white-space:nowrap;padding:8px 0 8px 12px;border-top:1px solid var(--line);font-weight:600}
.ds-calc tr.sub th,.ds-calc tr.sub td{color:var(--muted)}.ds-calc tr.end th,.ds-calc tr.end td{border-top:2px solid var(--ink);font-weight:750;font-size:16px}
.ds-matrix{width:100%;min-width:540px;table-layout:fixed;border-collapse:separate;border-spacing:0;font-size:14px;line-height:1.45}
.ds-matrix th,.ds-matrix td{hyphens:auto;-webkit-hyphens:auto;overflow-wrap:break-word;padding:10px 12px;vertical-align:top;text-align:left;border-top:1px solid var(--line)}
.ds-matrix thead th{border-top:0;font-size:15px}.ds-matrix thead th small{display:block;font-weight:400;font-size:12.5px;color:var(--muted)}
.ds-matrix thead th:first-child{width:104px}.ds-matrix tbody th{font-size:12.5px;color:var(--muted);font-weight:650}
.ds-matrix tr.ds-rel td{background:var(--primary-soft);font-size:13.5px}.ds-matrix .muted{color:var(--muted)}
.ds-dec{display:flex;flex-direction:column;gap:6px}.ds-dec .chip{width:100%;min-height:34px;font-size:13px;padding:5px 10px}
.ds-checks{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.ds-check{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 12px;min-height:48px;font-size:15px;color:var(--ink)}
.ds-check i{flex:none;width:22px;height:22px;border-radius:7px;border:2px solid var(--line-2);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:13px}
.ds-check[aria-pressed=true]{border-color:var(--primary);background:var(--primary-soft)}.ds-check[aria-pressed=true] i{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.ds-check small{color:var(--muted)}
.ds-path{display:none}
.ds-card .chartbox{border:0;margin:0 0 8px}
.pf-tarif:empty{display:none}

.opt-cards{display:none}
.opt-c{border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0 0 10px;background:var(--surface)}
.opt-c h4{margin:0 0 8px;font-size:16px;text-transform:none;letter-spacing:0;color:var(--ink)}.opt-c h4 small{display:block;font-size:12.5px;font-weight:400;color:var(--muted)}
.opt-c dl{margin:0}.opt-c dl div{padding:6px 0;border-top:1px solid var(--line)}.opt-c dt{font-size:12px;font-weight:650;color:var(--muted)}.opt-c dd{margin:2px 0 0;font-size:14px}
.opt-c .rel{background:var(--primary-soft);margin:0 -14px;padding:6px 14px}
@container (max-width:600px){.bs-body .tw:has(.ds-matrix){display:none}.opt-cards{display:block}}

.trfb{margin:0 0 16px;border-color:var(--primary)}.trfb-g{margin:0 0 12px;font-size:16px}.trfb-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.trfb h4{margin:0 0 6px;font-size:14px;text-transform:none;letter-spacing:0;color:var(--ink)}
@media(max-width:620px){.trfb-2{grid-template-columns:1fr}}

/* ===== Training: Einstellungen, Coaching-Hinweis, strukturiertes Feedback, Verlauf ===== */
.tr-set{display:flex;flex-direction:column;gap:14px;margin:0 0 16px;padding:16px 18px;border:1px solid var(--line);border-radius:var(--r-l);background:var(--surface)}
.tr-row .plbar{margin:4px 0 0}.tr-row .seg{max-width:420px;margin-top:4px}.tr-d{margin:6px 0 0;font-size:13.5px;line-height:1.45}
.chip[disabled]{opacity:.55;cursor:not-allowed}
.trc-l{margin:0 0 3px;font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}.trc-l em{font-style:normal;text-transform:none;letter-spacing:0;font-weight:500;margin-left:6px;padding:1px 7px;border-radius:999px;background:var(--warn-soft);color:var(--ink-2)}
.cm-x{align-self:flex-start;margin:-4px 0 0 6px}
.tr-bulb{display:inline-flex;align-items:center;gap:5px;padding:3px 10px 3px 7px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:12.5px;cursor:pointer;transition:color .12s,border-color .12s}

@keyframes trc-in{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
.trc-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 4px}.trc-h b{display:inline-flex;align-items:center;gap:6px}.trc-h svg{color:#C9930E}
.trc-zu{margin:0 0 8px;color:var(--muted);font-size:13px;font-style:italic}
.trc-s{margin:8px 0 0}.trc-s p{margin:0}.trc-s ul{margin:0;padding-left:18px}
.trc-r{margin:0;padding-left:18px}.trc-r li{margin:0 0 4px}.trc-r b{display:block;font-size:13px}.trc-r span{font-family:var(--font-serif);font-size:15px}
.trfb-h{margin:16px 0 8px;font-size:14px}
.trk{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:6px 24px}
.trk li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:2px 10px;padding:6px 0;border-bottom:1px solid var(--line)}
.trk-n{font-weight:600;font-size:14px}.trk-s{font-size:12.5px;min-width:70px;text-align:right}.trk small{grid-column:1/-1;color:var(--muted);font-size:12.5px}
.trk-d{display:inline-flex;gap:3px}.trk-d i{width:9px;height:9px;border-radius:50%;background:var(--sunken);border:1px solid var(--line-2)}.trk-d i.on{background:var(--primary);border-color:var(--primary)}
.trp{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.trp-i{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:6px 18px;padding:12px 14px;border:1px solid var(--line);border-left:3px solid var(--primary);border-radius:var(--r)}.trp-i.gut{border-left-color:var(--ok)}
.trp-k{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px;color:var(--muted)}.trp-ref{font-weight:700;color:var(--ink)}
.trp-o blockquote{margin:2px 0 0;padding:6px 10px;background:var(--sunken);border-radius:var(--r-s);font-size:14px}
.trp-e p{margin:0 0 6px;font-size:14px}.trp-e .kq{margin:0 0 6px}.trp-f{color:var(--muted)}
.tr-ueb{margin:14px 0 4px;padding:10px 14px;border-radius:var(--r);background:var(--primary-soft)}.tr-ueb p{margin:0}
.trh{margin:20px 0 0}
.trv{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px}.trv li span{display:inline-block;min-width:30px;font-weight:700;color:var(--muted)}.trv li.u span{color:var(--primary)}
@media(max-width:700px){.trk{grid-template-columns:1fr}.trp-i{grid-template-columns:1fr}}

/* ===== Beratung ===== */
.bhero{display:flex;gap:24px;align-items:flex-end;justify-content:space-between;margin:8px 0 20px;padding:28px 32px;border-radius:24px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-1)}
.bhero h2{margin:0 0 6px;font-size:28px}.bhero p{margin:0;max-width:620px}
.bh-k{max-width:280px}
.tcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin:0 0 28px}
.tcards.small{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin:8px 0 20px}
.tcard{position:relative;display:flex;flex-direction:column;text-align:left;border-radius:var(--r-l);background:var(--surface);border:1px solid var(--line);overflow:hidden;box-shadow:var(--shadow-1);transition:border-color .12s,box-shadow .12s,transform .12s}
.tcard:hover{border-color:var(--primary);box-shadow:var(--shadow-2);transform:translateY(-1px)}
.tcard.on{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary)}
.tc-ill svg{display:block;width:100%;height:auto}

.tc-b{display:flex;flex-direction:column;gap:4px;padding:14px 16px 16px}
.tc-b strong{font-size:16px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}.tc-b>span:last-child{font-size:13.5px;color:var(--muted);line-height:1.4}

.tc-ic{display:none}
.tc-check{position:absolute;top:10px;right:10px;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--surface);border:2px solid var(--line-2);font-weight:800;color:var(--primary-ink)}
.tcard.on .tc-check{background:var(--primary);border-color:var(--primary)}
.anl-tag{font-style:normal;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--primary);color:var(--primary-ink)}

function normalize(d){
  if(!d||!Array.isArray(d.todos)||!Array.isArray(d.angebote)||!Array.isArray(d.termine))return null;
  d.v=3;
  if(!Array.isArray(d.laufend))d.laufend=[];

/* ---------- helpers ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function pad(n){return String(n).padStart(2,'0')}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function todayIso(){return iso(new Date())}
function addDaysIso(s,n){var p=s.split('-').map(Number);return iso(new Date(p[0],p[1]-1,p[2]+n))}
function endOfWeekIso(){var k=(new Date().getDay()+6)%7;return addDaysIso(todayIso(),6-k)}
function diffDays(a,b){var A=a.split('-').map(Number),B=b.split('-').map(Number);return Math.round((Date.UTC(B[0],B[1]-1,B[2])-Date.UTC(A[0],A[1]-1,A[2]))/DAY)}
function toTs(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]).getTime()}
function fmtDate(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]).toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit'})}
function fmtFull(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'})}
function rel(s){var n=diffDays(todayIso(),s);if(n===0)return 'heute';if(n===1)return 'morgen';if(n===-1)return 'gestern';if(n<0)return 'seit '+(-n)+' Tagen';return 'in '+n+' Tagen'}
function whenLabel(s){return s?fmtDate(s)+', '+rel(s):'ohne Datum'}
function $(id){return document.getElementById(id)}
function isOpenAng(a){return a.status==='offen'||a.status==='nachgefasst'}
function sparteBereich(s){
  if(s==='Leben und Rente'||s==='Berufsunfähigkeit')return 'Altersvorsorge';
  if(s==='Kranken')return 'Krankenversicherung';
  if(!s||s==='Sonstiges')return '';
  return 'Sachversicherungen';
}

/* ---------- validation ---------- */
function checkKunde(v){
  if(!v)return 'Bitte eine Kundennummer eintragen.';
  if(v.length>20)return 'Die Nummer ist zu lang (höchstens 20 Zeichen).';
  if(!/^[A-Za-z0-9._\-]+$/.test(v))return 'Nur Zahlen, Buchstaben und Bindestrich. Keine Namen.';
  if(/^[A-Za-z]{4,}$/.test(v))return 'Das sieht wie ein Name aus. Bitte eine Nummer verwenden.';
  return '';
}
function checkText(v){
  if(!v)return '';
  var bad='Das sieht nach persönlichen Daten aus (E-Mail, Telefon, Geburtsdatum oder Adresse). Bitte entfernen.';
  if(/[\w.+-]+@[\w-]+\.[\w.-]+/.test(v))return bad;
  if(/\+?\d[\d\s\/\-]{7,}\d/.test(v))return bad;
  if(/\b\d{1,2}\.\s?\d{1,2}\.\s?19\d{2}\b/.test(v))return bad;
  if(/\bgeb(\.|oren)/i.test(v))return bad;
  if(/\w*(straße|strasse|str\.|weg|allee|platz|gasse)\s*\d+/i.test(v))return bad;
  return '';
}

/* ---------- hints (local rules only) ---------- */
function lastActivity(k){
  var m=0,t=todayIso();
  db.termine.forEach(function(x){if(x.kunde===k&&x.datum<=t)m=Math.max(m,toTs(x.datum))});
  db.beratungen.forEach(function(x){if(x.kunde===k&&x.datum<=t)m=Math.max(m,toTs(x.datum))});
  db.todos.forEach(function(x){if(x.kunde===k&&x.doneAt)m=Math.max(m,x.doneAt)});
  db.angebote.forEach(function(x){if(x.kunde===k){m=Math.max(m,x.ts||0);(x.log||[]).forEach(function(l){m=Math.max(m,toTs(l))})}});
  return m;
}
function computeHints(){
  var hs=[],now=Date.now();
  db.angebote.forEach(function(a){
    if(isOpenAng(a)&&!(a.log&&a.log.length)&&a.ts&&(now-a.ts)>=30*DAY)
      hs.push({key:'ng:'+a.id,prio:1,text:'Angebot '+a.sparte+' (Nr. '+a.kunde+') ist seit '+Math.floor((now-a.ts)/DAY)+' Tagen offen und wurde noch nicht nachgefasst.',btn:'open-ang',id:a.id});
  });
  db.beratungen.forEach(function(b){
    if(!b.wv)hs.push({key:'bw:'+b.id,prio:2,text:'Beratung '+b.bereich+' (Nr. '+b.kunde+') hat keine Wiedervorlage.',btn:'open-ber',id:b.id});
  });
  allKunden().forEach(function(k){
    var open=db.todos.some(function(x){return x.kunde===k&&!x.done})||db.angebote.some(function(x){return x.kunde===k&&isOpenAng(x)});
    var la=lastActivity(k);
    if(!open&&la&&(now-la)>=90*DAY)
      hs.push({key:'kk:'+k,prio:3,text:'Nr. '+k+': seit '+Math.floor((now-la)/DAY)+' Tagen kein Kontakt erfasst. Ist ein Jahresgespräch sinnvoll?',btn:'open-kunde',k:k});
  });
  var dis=db.dismissed||{};
  return hs.filter(function(h){return !(dis[h.key]&&now-dis[h.key]<60*DAY)}).sort(function(a,b){return a.prio-b.prio});
}
function hintsHtml(){
  var hs=computeHints();
  if(!hs.length)return '';
  var shown=hs.slice(0,8);
  var h='<details class="hints"><summary>Hinweise <span class="count">'+hs.length+'</span></summary>';
  shown.forEach(function(x){
    h+='<div class="hint"><div>'+esc(x.text)+'</div><div class="actions"><button class="btn small" data-act="'+x.btn+'"'+(x.id?' data-id="'+x.id+'"':'')+(x.k?' data-k="'+esc(x.k)+'"':'')+'>Öffnen</button><button class="btn small" data-act="hint-hide" data-key="'+esc(x.key)+'">Ausblenden</button></div></div>';
  });
  if(hs.length>shown.length)h+='<div class="hint" style="font-size:13px;color:var(--muted)">Weitere '+(hs.length-shown.length)+' Hinweise erscheinen, sobald du diese erledigt oder ausgeblendet hast.</div>';
  h+='<div class="fine">Automatische Gesprächsanlässe aus deinen Einträgen, rein lokal berechnet. Keine Beratungsempfehlung.</div></details>';
  return h;
}

function syncWv(b){
  var t=db.todos.find(function(x){return x.ref===b.id&&!x.done});
  if(b.wv){
    var text='Wiedervorlage Beratung '+b.bereich;
    if(t){t.due=b.wv;t.text=text;t.kunde=b.kunde}
    else db.todos.push({id:uid(),kunde:b.kunde,text:text,due:b.wv,done:false,ts:Date.now(),ref:b.id});
  }else if(t){db.todos=db.todos.filter(function(x){return x!==t})}
}
function saveAdd(){
  readAdd();
  var s=addState,k=s.kunde.trim().toUpperCase();
  var e=checkKunde(k)||checkText(s.text)||checkText(s.note);
  if(!e){
    if(s.type==='todo'&&!s.text.trim())e='Bitte eintragen, was zu tun ist.';
    else if((s.type==='termin'||s.type==='beratung')&&!s.datum)e='Bitte ein Datum wählen.';
    else if(s.type==='vertrag'&&!s.ablauf)e='Bitte das Ablaufdatum wählen.';
    else if(s.type==='beratung'&&s.erg==='verloren'&&!s.grund)e='Bitte den Grund wählen, warum der Kunde nicht abgeschlossen hat.';
  }
  if(e){s.err=e;renderAdd();return}
  var now=Date.now();
  if(s.type==='todo')db.todos.push({id:uid(),kunde:k,text:s.text.trim(),due:s.due||'',done:false,ts:now,wait:!!s.wait,prio:!!s.prio});
  else if(s.type==='vertrag')db.vertraege.push({id:uid(),kunde:k,sparte:s.sparte,ablauf:s.ablauf,frist:s.frist||'3',note:s.note.trim(),ts:now});
  else if(s.type==='angebot')db.angebote.push({id:uid(),kunde:k,sparte:s.sparte,status:'offen',nachfass:s.nachfass||'',note:s.note.trim(),log:[],ts:now});
  else if(s.type==='termin'){
    db.termine.push({id:uid(),kunde:k,datum:s.datum,zeit:s.zeit||'',anliegen:s.anliegen||'',sparte:s.sparte,note:s.note.trim(),ts:now});
    if(s.nachb)db.todos.push({id:uid(),kunde:k,text:'Nachbereitung'+(s.sparte?' ('+s.sparte+')':''),due:s.datum,done:false,ts:now+1});
  }else{
    var b={id:uid(),kunde:k,bereich:s.bereich,datum:s.datum,note:s.note.trim(),wv:s.wv||'',erg:s.erg||'offen',grund:s.erg==='verloren'?s.grund:'',ber:s.ber||'',fil:s.fil||'',ts:now};
    db.beratungen.push(b);syncWv(b);
  }
  save();closeSheet();render();toast('Gespeichert');
}

/* ---------- todo sheet ---------- */
function openTodo(id){
  var x=db.todos.find(function(t){return t.id===id});if(!x)return;
  todoDraft={id:id,text:x.text,due:x.due||'',err:''};
  renderTodo();
}
function renderTodo(){
  var d=todoDraft,x=db.todos.find(function(t){return t.id===d.id});
  var h='<h3>To-do</h3><p class="sub"><span class="tag">'+esc(x.kunde)+'</span></p>';
  h+='<label for="t-text">Was ist zu tun?</label><input type="text" id="t-text" maxlength="140" value="'+esc(d.text)+'">';
  h+='<label for="t-due">Wann?</label>'+winChips('t-due')+'<input type="date" id="t-due" value="'+esc(d.due)+'">';
  h+='<label class="ck"><input type="checkbox" id="t-wait"'+(x.wait?' checked':'')+'> Wartet auf den Kunden (Nachfassen)</label><label class="ck"><input type="checkbox" id="t-prio"'+(x.prio?' checked':'')+'> Wichtig (hohe Priorität)</label>';
  if(d.err)h+='<p class="err" role="alert">'+esc(d.err)+'</p>';
  h+='<div class="btnrow"><button class="btn danger" data-act="del-todo" data-id="'+x.id+'" data-confirm="Wirklich löschen?">Löschen</button><button class="btn primary" data-act="save-todo">Speichern</button></div>';
  openSheet(h);
}
function saveTodo(){
  var d=todoDraft,x=db.todos.find(function(t){return t.id===d.id});
  var text=$('t-text').value.trim(),due=$('t-due').value;
  var e=!text?'Bitte eintragen, was zu tun ist.':checkText(text);
  if(e){d.text=text;d.due=due;d.err=e;renderTodo();return}
  x.text=text;x.due=due;x.wait=!!$('t-wait').checked;x.prio=!!$('t-prio').checked;
  if(x.ref){var b=db.beratungen.find(function(y){return y.id===x.ref});if(b)b.wv=due}
  save();closeSheet();render();toast('Gespeichert');
}

function applyNach(id,date,status){
  var a=db.angebote.find(function(x){return x.id===id});if(!a)return;
  var prev={status:a.status,nachfass:a.nachfass,log:(a.log||[]).slice()};
  if(!status){a.log=(a.log||[]).concat(todayIso());a.status='nachgefasst';a.nachfass=date}
  else{a.status=status;a.nachfass=''}
  save();closeSheet();render();
  toast(status?STATUS[status]:'Nachgefasst gespeichert',function(){a.status=prev.status;a.nachfass=prev.nachfass;a.log=prev.log;save();render()});
}

/* ---------- nummer sheet ---------- */
function akteText(k){
  var L=['Kundenakte Nr. '+k,'Stand: '+fmtFull(todayIso()),''];
  var be=db.beratungen.filter(function(x){return x.kunde===k}).sort(function(a,b){return a.datum.localeCompare(b.datum)});
  L.push('BERATUNGEN');
  if(!be.length)L.push('- keine');
  be.forEach(function(b){L.push('- '+fmtFull(b.datum)+', '+b.bereich+(b.note?': '+b.note:'')+(b.wv?' (Wiedervorlage: '+fmtFull(b.wv)+')':''))});
  L.push('','TERMINE');
  var tm=db.termine.filter(function(x){return x.kunde===k}).sort(function(a,b){return a.datum.localeCompare(b.datum)});
  if(!tm.length)L.push('- keine');
  tm.forEach(function(x){L.push('- '+fmtFull(x.datum)+(x.sparte?', '+x.sparte:'')+(x.note?': '+x.note:''))});
  L.push('','ANGEBOTE');
  var ag=db.angebote.filter(function(x){return x.kunde===k});
  if(!ag.length)L.push('- keine');
  ag.forEach(function(a){L.push('- '+a.sparte+', '+STATUS[a.status]+(isOpenAng(a)&&a.nachfass?', nachfassen am '+fmtFull(a.nachfass):'')+(a.note?': '+a.note:''))});
  L.push('','VERTRÄGE (ABLAUF)');
  var vt=db.vertraege.filter(function(x){return x.kunde===k});
  if(!vt.length)L.push('- keine');
  vt.forEach(function(v){L.push('- '+v.sparte+', läuft ab '+fmtFull(v.ablauf)+', Kündigung bis '+fmtFull(vtInfo(v).bis)+(v.note?': '+v.note:''))});
  L.push('','OFFENE TO-DOS');
  var td=db.todos.filter(function(x){return x.kunde===k&&!x.done});
  if(!td.length)L.push('- keine');
  td.forEach(function(x){L.push('- '+x.text+(x.due?' (fällig '+fmtFull(x.due)+')':''))});
  return L.join('\n');
}
function kundeEvents(nr){
  var ev=[];function dts(t){return t?iso(new Date(t)):''}
  db.beratungen.forEach(function(b){if(b.kunde===nr)ev.push({d:b.datum,k:'Beratung',t:b.bereich+' · '+ergLabel(b),act:'open-ber',id:b.id,c:'b'})});
  db.termine.forEach(function(t){if(t.kunde===nr)ev.push({d:t.datum,k:'Termin',t:(t.zeit?t.zeit+' Uhr · ':'')+(t.anliegen?themaName(t.anliegen):(t.sparte||'ohne Thema'))+(t.note?' · '+t.note:''),c:'t'})});
  db.angebote.forEach(function(a){if(a.kunde===nr)ev.push({d:dts(a.ts),k:'Angebot',t:a.sparte+' · '+STATUS[a.status]+(isOpenAng(a)&&a.nachfass?' (nachfassen '+fmtDate(a.nachfass)+')':''),act:'open-ang',id:a.id,c:'a'})});
  db.vertraege.forEach(function(v){if(v.kunde===nr)ev.push({d:v.ablauf,k:'Vertrag',t:v.sparte+' läuft ab',act:'open-vertrag',id:v.id,c:'v'})});
  db.todos.forEach(function(x){if(x.kunde===nr)ev.push({d:x.done?dts(x.doneAt||x.ts):(x.due||dts(x.ts)),k:x.wait?'Wartet':'Aufgabe',t:x.text+(x.done?' (erledigt)':''),act:'open-todo',id:x.id,c:'o'})});
  return ev.filter(function(e){return e.d}).sort(function(a,b){return b.d.localeCompare(a.d)});
}
function kundeLast(nr){var e=kundeEvents(nr).filter(function(x){return x.d<=todayIso()});return e.length?e[0].d:''}
function kundeTimeline(nr){
  var ev=kundeEvents(nr);if(!ev.length)return '<p class="hint-t">Noch keine Einträge.</p>';
  return '<div class="tl3">'+ev.slice(0,30).map(function(e){return '<'+(e.act?'button data-act="'+e.act+'" data-id="'+e.id+'"':'div')+' class="tle c-'+e.c+'"><i></i><span class="tld">'+fmtDate(e.d)+'</span><span class="tlt"><b>'+e.k+'</b> '+esc(e.t)+'</span></'+(e.act?'button':'div')+'>'}).join('')+'</div>';
}

var Eng=(function(){
function rm(r){return Math.pow(1+r,1/12)-1}

function annFac(i,re,D){var m=rm(re),s=0;for(var k=0;k<12*D;k++){s+=Math.pow(1+i,Math.floor(k/12))/Math.pow(1+m,k)}return s}

function bedarf(p){
  var n=p.rentenalter-p.alter,D=p.lebenserw-p.rentenalter;
  if(!(n>=1)||!(D>=1))return null;
  var f=Math.pow(1+p.infl,n);
  var lueckeHeute=Math.max(0,p.ziel-p.rente-p.vorsorge);
  var lueckeNom=lueckeHeute*f;
  var A=annFac(p.infl,p.re,D);
  var C=lueckeNom*A;
  var N=12*n,FV=fvFac(p.ra,N),FVd=n>1?fvFac(p.ra,12*(n-1)):NaN;
  var FVe=(p.einmal||0)*Math.pow(1+p.ra,n);
  var restC=Math.max(0,C-FVe);
  var sNow=restC/FV,sDelay=n>1?restC/FVd:NaN;
  var out={n:n,D:D,f:f,A:A,lueckeHeute:lueckeHeute,lueckeNom:lueckeNom,zielNom:p.ziel*f,renteNom:p.rente*f,vorsorgeNom:p.vorsorge*f,
    C:C,sNow:sNow,sDelay:sDelay,delayCost:sDelay-sNow};
  if(p.sparen>=0&&isFinite(p.sparen)){
    var S=p.sparen;
    var fvS=S*FV+FVe,fvSd=n>1?S*FVd+FVe:NaN;
    var W=fvS/A;
    out.S=S;out.fvS=fvS;out.fvSdelay=fvSd;out.entgangen=fvS-fvSd;

    out.lueckeNach=Math.max(0,p.ziel-out.gesamtHeuteNach);
    out.gesamtHeuteVor=p.rente+p.vorsorge;
  }
  return out;
}

/* ---- Berechnung Geldanlage ---- */
function calcAn(){
  var a=adv.an,e=nv(a.einmal),m=nv(a.monat),j=nv(a.jahre),al=nv(a.alter);
  if(isNaN(e))e=0;if(isNaN(m))m=0;
  if(!(j>0))return {err:'Bitte die Laufzeit in Jahren eintragen.'};
  if(!(e>0||m>0))return {err:'Bitte Einmalanlage oder monatlichen Beitrag eintragen.'};
  var ein=e+m*12*j,sz=[['low','Vorsichtig','#5B6773'],['mid','Mittleres Szenario','#1F7A8C'],['high','Chancenreich','#6B4FA0']].map(function(x){return {key:x[0],name:x[1],c:x[2],w:nv(a.szen[x[0]])}}).filter(function(z){return isFinite(z.w)});
  var endAlter=isFinite(al)?al+j:NaN;
  return {e:e,m:m,j:j,ein:ein,sz:sz,endAlter:endAlter,halb:isFinite(endAlter)?(j>=12&&endAlter>=62):null,ent:nv(a.entnahme),vorteil:nv(a.vorteil)};
}
function calcWarten(c){
  var out=[];if(!(c.lueckeHeute>0)||!isFinite(c.b.C))return out;
  [[0,'Heute'],[1,'In 1 Jahr'],[3,'In 3 Jahren'],[5,'In 5 Jahren'],[10,'In 10 Jahren']].forEach(function(l){
    var N=c.n-l[0];if(N<1)return;
    out.push({l:l[1],s:c.b.C/Eng.fvFac(c.o.ra,12*N)});
  });
  return out;
}
function rurupNetto(ru){return (ru&&isFinite(ru.T))?ru.b-ru.T/12:NaN}

/* ---- zusätzliche Diagramme ---- */
function wrapTxt(x,t,cx,y,maxW,lh,align){
  var words=String(t).split(' '),line='',yy=y;x.textAlign=align||'left';
  words.forEach(function(w){var test=line?line+' '+w:w;if(x.measureText(test).width>maxW&&line){x.fillText(line,cx,yy);yy+=lh;line=w}else line=test});
  if(line){x.fillText(line,cx,yy);yy+=lh}return yy;
}
function chartWarten(c){

}

}
function chartSteuerZeit(){

    rrect(x,L,y,span,40,10,col);x.fillStyle='#fff';x.font='bold 22px '+FONT;x.textAlign='left';x.textBaseline='middle';x.fillText(title,L+16,y+21);
    x.strokeStyle=col;x.lineWidth=5;x.beginPath();x.moveTo(L,y+110);x.lineTo(R,y+110);x.stroke();
  }

  function txt(px,y,t,w,align,col,bold){x.fillStyle=col||'#16202A';x.font=(bold?'bold ':'')+'18px '+FONT;x.textBaseline='alphabetic';wrapTxt(x,t,L+px*span,y,w,23,align||'left')}
  var y1=84,y2=300,red='#B3362D',grn='#2C7A57';

  dot(0.6,y1,red,10);dot(0.88,y1,red,12);
  txt(0.02,y1+148,'Jedes Jahr: Vorabpauschale kann Steuer auslösen',230,'left');
  txt(0.6,y1+148,'Umschichten: Gewinne werden sofort versteuert',210,'center');
  txt(0.88,y1+148,'Verkauf: '+REGEL.abg+' auf den Gewinn',190,'center');
  lane(y2,'Fondspolice',grn);
  x.fillStyle='#E8F3EC';rrect(x,L+0.02*span,y2+90,0.5*span,40,10,'#E8F3EC');
  x.fillStyle=grn;x.font='bold 19px '+FONT;x.textAlign='left';x.textBaseline='middle';x.fillText('Ansparphase ohne laufende Steuer',L+0.04*span,y2+110);
  dot(0.6,y2,grn,10);dot(0.88,y2,grn,12);
  txt(0.02,y2+148,'Fondswechsel in der Police lösen keine Steuer aus',230,'left');

  txt(0.88,y2+148,'Auszahlung: ab 12 Jahren und ab 62 nur 50 % des Ertrags steuerpflichtig',230,'center');

  return k.c;
}

      else if(t==='entw')cvs=chartEntw();
      else if(t==='alter'){var ka=calcKvAlter();if(!ka.err)cvs=chartAlter(ka)}
      else if(t==='anlage'){a=a||calcAn();if(!a.err)cvs=chartAnlage(a)}

function buCalc(){
  var n=nv(adv.al.gehalt),f=nv(adv.bu.fix),e=nv(adv.bu.emr),h=nv(adv.bu.has);
  var o={n:n,f:f,e:isNaN(e)?0:e,h:isNaN(h)?0:h,eIn:!isNaN(e),hIn:!isNaN(h)};
  o.v=o.e+o.h;o.lueN=isNaN(n)?NaN:Math.max(0,n-o.v);o.lueF=isNaN(f)?NaN:Math.max(0,f-o.v);
  return o;
}

var PFPRIO=[['zuhause','Möglichst lange zu Hause leben'],['partner','Den Partner finanziell schützen'],['angeh','Angehörige möglichst wenig belasten'],['selbst','Finanziell selbstständig bleiben'],['wahl','Die Pflegeform selbst wählen können']];

 ['eigen','Eigene Mittel','Rente und Vermögen',

function pfObj(){var p=adv.pf;if(!p.lage)p.lage={};if(!p.opt)p.opt={};if(!p.offen)p.offen=[];if(p.fragen==null)p.fragen='';if(p.next==null)p.next='';if(p.ort==null)p.ort='';if(p.bestand==null)p.bestand='';return p}
function pfG(){var g=parseInt(adv.pf.pg,10);return g>=1&&g<=5?g:3}
function pfLbl(list,v){var o=list.filter(function(x){return x[0]===v})[0];return o?o[1]:''}
/* Heim: Eigenanteil je Aufenthaltsjahr. REGEL.pflege.eee ist der pflegebedingte Anteil im ersten Jahr,
   also schon um den Leistungszuschlag von 15 % gemindert. Daraus folgt der volle Anteil vor Zuschlag. */
function pfHeimJahre(){
  var P=REGEL.pflege,voll=P.eee/(1-P.zuschlag[0]/100),fix=P.uv+P.invest;
  return P.zuschlag.map(function(z,i){return {jahr:i+1,zuschlag:voll*z/100,eigen:voll*(1-z/100)+fix}});
}
function pfCalc(){
  var P=REGEL.pflege,p=pfObj(),g=pfG(),o={g:g,geld:P.geld[g],sach:P.sach[g],heimK:P.heim[g]};
  var kz=nv(p.kost),he=nv(p.heim),r=nv(adv.vp.rente),v=nv(adv.vp.verm),mh=nv(p.mgH),ms=nv(p.mgS),be=nv(p.bestand);
  o.kz=kz;o.r=r;o.v=v;o.best=isNaN(be)?0:Math.max(0,be);o.mgH=isNaN(mh)?0:mh;o.mgS=isNaN(ms)?0:ms;
  o.tarif=o.mgH>0||o.mgS>0;o.ok=!!p.bed;
  /* Zu Hause mit Pflegedienst: Kosten minus Sachleistung (höchstens die Kosten) */
  o.sachGenutzt=isNaN(kz)?NaN:Math.min(kz,o.sach);
  o.ebZ=isNaN(kz)?NaN:Math.max(0,kz-o.sach);
  o.ebZB=isNaN(o.ebZ)?NaN:Math.max(0,o.ebZ-o.best);
  o.ebZT=isNaN(o.ebZB)?NaN:Math.max(0,o.ebZB-o.mgH);
  /* Pflegeheim: nur ab Pflegegrad 2 aussagekräftig (Eigenanteil gilt für Pflegegrad 2 bis 5 gleich) */
  o.heimOk=g>=2;o.heimDef=isNaN(he);o.jahre=pfHeimJahre();
  if(o.heimDef){var j1=o.jahre[0];o.zuschlag=j1.zuschlag;o.ebH=j1.eigen;o.heimGes=o.heimK+o.ebH+o.zuschlag}
  else{o.zuschlag=NaN;o.ebH=he;o.heimGes=NaN}
  o.ebHB=Math.max(0,o.ebH-o.best);o.ebHT=Math.max(0,o.ebHB-o.mgS);
  o.lueH=isNaN(r)?NaN:Math.max(0,o.ebH-r-o.best);o.lueHT=isNaN(r)?NaN:Math.max(0,o.ebH-r-o.best-o.mgS);
  o.monH=pfReichweite(o,0);o.monHT=o.mgS>0?pfReichweite(o,o.mgS):null;
  return o;
}
/* Wie viele Monate reicht das Vermögen im Heim? Rechnet mit dem sinkenden Eigenanteil je Jahr,
   wenn der Bundesdurchschnitt verwendet wird, sonst mit dem eingetragenen festen Betrag. */
function pfReichweite(o,extra){
  if(!o.heimOk||isNaN(o.r)||!(o.v>=0))return null;
  var rest=o.v,m=0;
  while(m<600){
    var e=o.heimDef?o.jahre[Math.min(3,Math.floor(m/12))].eigen:o.ebH,luecke=e-o.r-o.best-extra;
    if(luecke<=0)return m===0?null:Infinity;
    if(rest<luecke)return m;
    rest-=luecke;m++;
  }
  return Infinity;
}
function pfReichTxt(m){if(m===Infinity)return 'auf Dauer, weil die Lücke mit den Jahren kleiner wird';if(m===0)return 'nicht einmal einen Monat';return 'etwa '+pfMonTxt(m)}
function pfMonTxt(m){if(m===null)return '';if(m===Infinity)return 'dauerhaft';var j=Math.floor(m/12),r=m%12;return (j?j+(j===1?' Jahr':' Jahre'):'')+(j&&r?' und ':'')+(r||!j?r+(r===1?' Monat':' Monate'):'')}
/* Kostenbrücke: von den Kosten zum Betrag, der monatlich fehlt. Jede Zeile nennt ihre Herkunft. */
function pfBruecke(art,mitAngebot){
  var o=pfCalc(),R=[];
  if(art==='heim'){
    if(!o.heimOk)return null;
    if(o.heimDef){
      R.push({l:'Kosten im Pflegeheim',v:o.heimGes,t:'start',q:'Leistung der Kasse plus Eigenanteil, Bundesdurchschnitt'});
      R.push({l:'Pflegekasse (Pflegegrad '+o.g+')',v:-o.heimK,t:'minus',q:'SGB XI § 43'});
      R.push({l:'Leistungszuschlag im ersten Jahr (15 %)',v:-o.zuschlag,t:'minus',q:'SGB XI § 43c'});
    }else R.push({l:'Eigenanteil laut Angabe',v:o.ebH,t:'start',q:'eingetragen'});
    if(o.heimDef)R.push({l:'Eigenanteil im ersten Jahr',v:o.ebH,t:'sub',q:'vdek, Stand 1. Januar 2026'});
    if(!isNaN(o.r))R.push({l:'Rente oder Einkommen',v:-o.r,t:'minus',q:'Angabe im Gespräch'});
  }else{
    if(isNaN(o.kz))return null;
    R.push({l:'Kosten der Pflege zu Hause',v:o.kz,t:'start',q:'Schätzung im Gespräch'});
    R.push({l:'Pflegekasse, Pflegedienst (Pflegegrad '+o.g+')',v:-o.sachGenutzt,t:'minus',q:'SGB XI § 36'});
  }
  if(o.best>0)R.push({l:'Bestehende private Pflegeleistung',v:-o.best,t:'minus',q:'laut Vertrag'});
  var ang=art==='heim'?o.mgS:o.mgH;
  if(mitAngebot&&ang>0)R.push({l:'Leistung aus dem Angebot',v:-ang,t:'minus',q:o.ok?'laut Bedingungen geprüft':'noch zu prüfen'});
  var sum=0;R.forEach(function(x){if(x.t!=='sub')sum+=x.v});
  R.push({l:art==='heim'?(isNaN(o.r)?'Bleibt pro Monat zu zahlen':'Fehlt pro Monat'):'Bleibt zusätzlich zu den Lebenshaltungskosten',v:Math.max(0,sum),t:'end',q:sum<=0?'gedeckt':'Ergebnis'});
  return R;
}
function pfBrueckeTab(R){
  return '<table class="ds-calc"><tbody>'+R.map(function(x){var cls=x.t==='end'?' class="end"':x.t==='sub'?' class="sub"':'';return '<tr'+cls+'><th>'+esc(x.l)+'<small>'+esc(x.q)+'</small></th><td>'+(x.t==='minus'?'− '+eur(-x.v):eur(x.v))+'</td></tr>'}).join('')+'</tbody></table>';
}
function chartPfBruecke(art,mitAngebot){
  var R=pfBruecke(art,mitAngebot);if(!R)return null;
  var W=760,rowH=70,T=104,H=T+R.length*rowH+24,k=cv(W,H),x=k.x,L=300,Rr=24,pw=W-L-Rr;
  var mx=niceMax(Math.max.apply(null,R.map(function(z){return Math.abs(z.v)}).concat([1]))*1.05);
  x.fillStyle='#16202A';x.font='bold 30px '+FONT;x.textAlign='left';x.textBaseline='alphabetic';
  x.fillText(art==='heim'?'Pflegeheim: Was bleibt pro Monat?':'Zu Hause: Was bleibt pro Monat?',24,44);
  x.fillStyle='#5B6773';x.font='20px '+FONT;x.fillText('Beispielrechnung in Euro pro Monat, Pflegegrad '+pfG(),24,76);
  var run=0;
  R.forEach(function(z,i){
    var y=T+i*rowH,a,b,col;
    if(z.t==='start'){a=0;b=z.v;run=z.v;col='#25507A'}
    else if(z.t==='sub'){a=0;b=z.v;col='#7B8FA6'}
    else if(z.t==='minus'){a=Math.max(0,run+z.v);b=run;run=run+z.v;col='#2C7A57'}
    else{a=0;b=z.v;col=z.v>0?'#B3362D':'#2C7A57'}
    x.fillStyle=z.t==='end'?'#16202A':'#27384F';x.font=(z.t==='end'||z.t==='start'?'bold ':'')+'22px '+FONT;x.textAlign='left';x.textBaseline='middle';
    wrapTxt(x,z.l,24,y+rowH/2-(x.measureText(z.l).width>L-40?12:0),L-40,24,'left');
    var x0=L+pw*a/mx,w=Math.max(3,pw*(b-a)/mx);
    rrect(x,x0,y+14,w,rowH-28,6,col);
    var lab=(z.t==='minus'?'− ':'')+eur(Math.abs(z.v));
    x.font='bold 22px '+FONT;x.textBaseline='middle';
    if(w>150){x.fillStyle='#fff';x.textAlign='right';x.fillText(lab,x0+w-12,y+rowH/2)}
    else{x.fillStyle='#16202A';x.textAlign='left';x.fillText(lab,Math.min(x0+w+10,W-120),y+rowH/2)}
    if(i<R.length-1&&z.t!=='end'){x.strokeStyle='#CBD3DB';x.lineWidth=2;x.setLineDash([5,5]);var xr=L+pw*Math.max(0,run)/mx;x.beginPath();x.moveTo(xr,y+rowH-14);x.lineTo(xr,y+rowH+14);x.stroke();x.setLineDash([])}
  });
  return k.c;
}
function chartPfJahre(){

  var mx=niceMax(J[0].eigen*1.1),gap=pw/J.length,bw=Math.min(170,gap*0.55);
  x.fillStyle='#16202A';x.font='bold 30px '+FONT;x.textAlign='left';x.textBaseline='alphabetic';x.fillText('Eigenanteil im Heim nach Aufenthaltsdauer',24,44);

function taskData(){
  var t=todayIso(),w=endOfWeekIso(),z=addDaysIso(t,14),items=[];
  db.todos.forEach(function(x){if(!x.done)items.push({kind:'todo',date:x.due||'',x:x})});
  db.angebote.forEach(function(a){if(isOpenAng(a))items.push({kind:'nach',date:a.nachfass||'',x:a})});
  function bucket(d){if(!d)return 'later';if(d<=t)return 'now';if(d<=w)return 'week';if(d<=z)return 'two';return 'later'}
  var g={now:[],week:[],two:[],later:[]};
  items.forEach(function(it){g[bucket(it.date)].push(it)});
  Object.keys(g).forEach(function(k){g[k].sort(function(a,b){return (a.date||'9999').localeCompare(b.date||'9999')||a.x.kunde.localeCompare(b.x.kunde)})});
  return {t:t,g:g,total:items.length};

/* ---- Ergebnisse ---- */
function jaegNote(c){
  return c.ueber?'<div class="note ok">Das Einkommen liegt über der Versicherungspflichtgrenze 2026 ('+eur(KV.jaeg)+' im Jahr). Ein Wechsel in die PKV ist möglich, wenn das Einkommen auch im laufenden Jahr voraussichtlich darüber liegt.</div>':'<div class="note">Das Einkommen liegt unter der Versicherungspflichtgrenze 2026 ('+eur(KV.jaeg)+' im Jahr). Als Angestellter ist ein Wechsel in die PKV dann nicht möglich.</div>';
}
function kvAusgang(c){
  var h='<div class="stats">'+stat('GKV bleiben mit Zusatz',eur(c.A),'pro Monat')+stat('GKV-Beitrag',eur(c.gkv),c.estUsed?'Schätzung, Arbeitnehmeranteil inkl. Pflege':'laut Abrechnung')+stat('Zusatzversicherungen',eur(c.zk+c.zn),'Kunde '+eur(c.zk)+', Kinder '+eur(c.zn))+'</div>';
  if(c.n>0)h+='<div class="note">In der GKV sind die Kinder in der Regel beitragsfrei familienversichert. In der PKV hat jedes Kind einen eigenen Beitrag.</div>';
  return jaegNote(c)+h;
}
function kvRes(){
  var c=calcKv();if(c.err)return '<div class="note">'+esc(c.err)+'</div>';
  var h=kvAusgang(c);
  if(!c.hasPkv)return h+'<div class="note">Trage den PKV-Beitrag des Kunden ein, dann erscheint der Vergleich.</div>';
  var d=c.eigen-c.A;
  h+='<div class="stats">'+stat('PKV Eigenanteil',eur(c.eigen),'Gesamtbeitrag '+eur(c.tot)+', Arbeitgeberzuschuss '+eur(c.agz))+stat('Unterschied zu GKV mit Zusatz',sgn(d),'pro Monat',d<=0?'good':'bad')+'</div>';
  if(c.cbOn)h+='<div class="stats">'+stat('Effektiv Jahr 1',eur(c.eff[0]),'mit Cashback')+stat('Effektiv Jahr 2',eur(c.eff[1]),'mit Cashback')+stat('Effektiv ab Jahr 3',eur(c.eff[2]),'mit Cashback','good')+'</div>';
  return h+'<div class="chartbox" data-c="kv"></div><p class="hint-t">Beitragsanpassungen sind in GKV und PKV möglich und nicht garantiert. Cashback vereinfacht vom Gesamtbeitrag gerechnet.</p>';
}
function alterRes(){
  var a=calcKvAlter();if(a.err)return '<div class="note">'+esc(a.err)+'</div>';
  var h='<div class="stats">'+stat('Gesamtbeitrag im Alter',eur(a.ges),a.manual?'manuell eingetragen':'hochgerechnet mit '+pctS(a.st/100)+' pro Jahr')+stat('Beitrag im Alter (PKV)',eur(a.end),'pro Monat','good')+(isFinite(a.gA)?stat(a.gEst?'GKV im Alter (Schätzung)':'GKV im Alter',eur(a.gA),'pro Monat'):'')+'</div>';
  h+='<div class="chartbox" data-c="alter"></div>';
  h+='<div class="note">Beitragssteigerungen kann niemand garantieren, weder in der PKV noch in der GKV. Auch der GKV-Beitrag steigt, etwa durch die steigende Beitragsbemessungsgrenze und höhere Zusatzbeiträge. In der PKV verringern Zuschlag, Beitragsentlastung, Zuschuss der Rentenversicherung und das wegfallende Krankentagegeld den Beitrag im Alter.</div>';
  return h;
}
function entwRes(){
  var D=KV_ENTW,n=D.years.length;

}
